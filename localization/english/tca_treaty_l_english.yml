l_english:
 tca_treaty.opening:0 "To [ROOT.Char.GetTitledFirstName],"
 tca_treaty.ack:0 "Understood."
 tca_treaty.1.cancel:0 "I propose that we peacefully dissolve our treaty. Neither realm will remain bound by its obligations."
 tca_treaty.1.waive:0 "I propose that we forgive the outstanding payment. Our treaty and future annual payments will otherwise remain unchanged."
 tca_treaty.1.free:0 "I propose a lasting peace between our realms. We shall refrain from aggression and restrain our subjects, while remaining free to defend our allies. No annual payment is required. Changes and peaceful dissolution require mutual consent."
 tca_treaty.1.offer:0 "I propose a lasting peace, with both courts restraining their subjects. My realm shall pay [scope:tca_treaty_proposal.Var('tca_treaty_amount').GetValue|0] annually. The first payment falls due a year after a new treaty is signed; amendments retain the existing payment date."
 tca_treaty.1.ask:0 "I propose a lasting peace, with both courts restraining their subjects. Your realm shall pay [scope:tca_treaty_proposal.Var('tca_treaty_amount').GetValue|0] annually. The first payment falls due a year after a new treaty is signed; amendments retain the existing payment date."
 tca_treaty.1.accept:0 "Accept the proposal."
 tca_treaty.1.reject:0 "I cannot accept."
 tca_treaty.2.yes:0 "I accept your proposed treaty terms. We shall both abide by this agreement."
 tca_treaty.2.no:0 "I cannot accept your proposed terms. Any existing treaty remains unchanged."
 tca_treaty.3.desc:0 "The annual payment remains outstanding. You have ninety days to pay it in full. Failure to do so will breach and dissolve our treaty."
 tca_treaty.3.pay:0 "Pay the arrears now."
 tca_treaty.3.grace:0 "I shall raise the funds within the grace period."
 tca_treaty.3.refuse:0 "I will pay no more."
 tca_treaty.3.break_tt:0 "Dissolve the treaty and suffer the Prestige and Fame penalties for breaking a Truce."
 tca_treaty.4.desc:0 "Our treaty has been dissolved following a breach. Neither realm remains bound by it, and outstanding payments are cancelled."
