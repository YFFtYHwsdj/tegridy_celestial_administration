l_english:
 trait_tca_fengci:0 "Temple Sinecure"
 trait_tca_fengci_desc:0 "Released from active office with a temple stipend. While holding a sinecure, this character receives no appointments, but may later seek to return to service."
 trait_tca_retired:0 "Retired from Service"
 trait_tca_retired_desc:0 "This character has permanently left official service and will no longer hold active office."
 tca_fengci_decision:0 "Request a Temple Sinecure"
 tca_fengci_decision_desc:0 "A career in service need not be a relentless march forward. Petitioning for a temple sinecure would let me step back from the press of officialdom and draw a quiet stipend, while leaving the door open should I wish to return to service later."
 tca_fengci_decision_tooltip:0 "Request a temple sinecure and suspend active appointments"
 tca_fengci_decision_confirm:0 "Submit the Request"
 tca_retire_decision:0 "Request Retirement"
 tca_retire_decision_desc:0 "Every career in office must come to an end. Rather than linger in officialdom, I may petition to retire, lay aside the concerns of service for good, and return home to spend my remaining years in peace."
 tca_retire_decision_tooltip:0 "Permanently leave official service"
 tca_retire_decision_confirm:0 "Request Retirement"
 tca_resume_decision:0 "Return to Service"
 tca_resume_decision_desc:0 "Though a temple sinecure offers quiet, my thoughts still turn to public affairs. While my strength holds, I could relinquish my sinecure and return to the selection rolls to await a new commission."
 tca_resume_decision_tooltip:0 "Request a return to official service"
 tca_resume_decision_confirm:0 "Seek Appointment"
 tca_retirement_native_transfer_desc:0 "Now that I have stepped back from officialdom, I need not keep the burdens of the family and estate entirely on my own shoulders. Handing leadership of the house to its lawful heir would let me enjoy my retirement with an easy mind."
 tca_retirement_native_decision_effect_tt:0 "Choose a temple sinecure or permanent retirement in the following event. The Influence cost of this decision is paid now; keeping office through this entry is not offered."
 tca_retirement_transfer_tooltip:0 "Transfer the family to its lawful heir"
 tca_retirement.10.t:0 "A Petition Concerning Service"
 tca_retirement.10.desc:0 "[scope:tca_retirement_applicant.GetTitledFirstName] petitions for a change in service. The decision rests with me."
 tca_retirement.10.honor:0 "Approve retirement with one honorary rank."
 tca_retirement.10.approve:0 "Grant the request at the current rank."
 tca_retirement.10.deny:0 "Deny the request; leave things as they are."
 tca_retirement.10.expired:0 "Circumstances have changed; this petition no longer requires a decision."
 tca_retirement.12.t:0 "An Imperial Decision"
 tca_retirement.12.approved:0 "The court has replied to your petition, and its decision has arrived."
 tca_retirement.12.denied:0 "Your petition was denied, and you are to remain as before. You may petition again after one year."
 tca_retirement.12.invalid:0 "Circumstances have changed and your previous petition has lapsed. Any future request will depend on your eligibility at that time."
 tca_retirement.20.t:0 "The Affairs of the Family"
 tca_retirement.20.desc:0 "With active service behind you, the family and estate still require a steward. Will you entrust the household to its lawful heir now, or continue managing it yourself for the time being?"
 tca_retirement.20.transfer:0 "Entrust the family to the heir."
 tca_retirement.20.keep:0 "I will continue for now."
 tca_retirement.continue:0 "Understood."
 tca_retirement.10.fengci:0 "[scope:tca_retirement_applicant.GetTitledFirstName] petitions for release from active office with a temple stipend. If approved, this official will receive no appointments while holding the sinecure, though a later return to service remains possible."
 tca_retirement.10.retire:0 "[scope:tca_retirement_applicant.GetTitledFirstName] petitions to leave office and retire permanently from service. How to answer this request rests with me."
 tca_retirement.10.resume:0 "[scope:tca_retirement_applicant.GetTitledFirstName] currently holds a temple sinecure and petitions to return to the selection rolls. Approval restores eligibility for future appointments without granting an immediate office."
 tca_retirement.10.honor_only:0 "[scope:tca_retirement_applicant.GetTitledFirstName] holds no active office and has already retired by precedent. Only the question of granting one honorary rank remains for my decision."
 tca_retirement.92.t:0 "Rank Awaiting Confirmation"
 tca_retirement.92.desc:0 "The honorary promotion remains unsettled, so the family cannot yet be transferred. Retirement status and the existing stipend remain in place."
 tca_retirement.92.retry:0 "Retry confirmation"
 tca_retirement_rank_settled_tt:0 "Your rank has been confirmed"
 tca_retirement_seniority_tt:0 "Hold active office, rank six or above, or a temple sinecure"
 tca_retirement_fengci_age_tt:0 "Reach the age for a temple sinecure (ten years before retirement age; sixty when no age is fixed)"
 tca_retirement_fengci_health_tt:0 "Or suffer an age-related ailment, incapacity, blindness, or critical health (allowing an earlier petition)"
 tca_retirement_retire_age_tt:0 "Reach retirement age (seventy when no age is fixed)"
 tca_retirement_retire_health_tt:0 "Or suffer a severe age-related ailment, incapacity, blindness, or critical health (allowing earlier retirement; with no fixed age, an age-related ailment from sixty also qualifies)"
 tca_retirement_no_pending_request_tt:0 "Have no petition awaiting a reply"
 tca_retirement_retry_available_tt:0 "If your last petition was refused, a year has passed"
 tca_fengci_decision_request_effect_tt:0 "Petition the Emperor for a temple sinecure. Approval releases you from office with a stipend based on your personal rank; you receive no appointments while holding the sinecure, and may later seek a return to service."
 tca_fengci_decision_effect_tt:0 "Enter a temple sinecure with a stipend based on your personal rank; you receive no appointments while holding the sinecure, and may later seek a return to service."
 tca_retire_decision_request_effect_tt:0 "Petition the Emperor for permanent retirement. Approval releases you from office with a stipend based on your personal rank; you cannot return to service, and honorary advancement depends on rank and imperial favor."
 tca_retire_decision_effect_tt:0 "Permanently retire with a stipend based on your personal rank; you cannot receive appointments or return to service, and honorary advancement depends on rank and imperial favor."
 tca_retirement_ai_evaluate_decision:0 "Consider Service and Retirement"
 tca_retirement_ai_evaluate_decision_desc:0 "Weigh continued service against a temple sinecure or retirement."
 tca_retirement_ai_transfer_decision:0 "Consider Passing on the Family"
 tca_retirement_ai_transfer_decision_desc:0 "Consider entrusting the family to its heir."
 tca_retirement.30.t:0 "A Time to Reconsider"
 tca_retirement.30.desc:0 "As years and circumstances shift, the next step in a life of service deserves fresh consideration."
 tca_retirement.30.keep:0 "For now, I shall carry on as before."
 tca_retirement.14.t:0 "An Honor in Retirement"
 tca_retirement.14.desc:0 "Having permitted [scope:tca_retirement_applicant.GetTitledFirstName] to retire, shall I grant one honorary rank as a mark of favor?"
 tca_resume_decision_request_effect_tt:0 "Petition the Emperor to return to service. Upon approval, spend [EmptyScope.ScriptValue('tca_retirement_resume_cost_value')|0] Influence to end your temple sinecure and restore eligibility for appointments without granting an immediate office; no cost is paid if refused or lapsed."
 tca_resume_decision_effect_tt:0 "Spend [EmptyScope.ScriptValue('tca_retirement_resume_cost_value')|0] Influence to end your temple sinecure and restore eligibility for appointments without granting an immediate office."
 tca_retirement_transfer_effect_tt:0 "Transfer the family title and estate to the lawful heir and continue play as that heir; your current character keeps their sinecure or retirement title, personal rank, retirement status, and stipend."
 tca_retirement.20.keep_tt:0 "Continue playing as your current character; while eligible, you may later pass on the family through the Renounce Family Leadership decision."
 tca_retirement_transfer_ready_tt:0 "Hold no active office and have no unsettled petitions or rank grants"
