l_english:
 ##################################################
 # Scales of Power (Grand Secretariat Administrative Rectification)
 ##################################################
 tca_diarch_admin_rectification_level_1: "[grand_secretariat_director|E] can use the #high $tca_rectify_subordination_interaction$#! and #high $tca_retract_concurrent_title_interaction$#! [interactions|E] on local officials who are not direct [vassals|E] of the [son_of_heaven|E] #WEAK (retracting [kingdom|E]-tier concurrent offices requires the $game_concept_son_of_heaven$'s approval)#!"
 tca_diarch_admin_rectification_level_3: "[grand_secretariat_director|E] can use the #high $tca_rectify_subordination_interaction$#! and #high $tca_retract_concurrent_title_interaction$#! [interactions|E] on direct local [vassals|E] of the [son_of_heaven|E] #WEAK (retracting [kingdom|E]-tier concurrent offices still requires the $game_concept_son_of_heaven$'s approval)#!"
 tca_diarch_admin_rectification_level_4: "[grand_secretariat_director|E] can directly execute the #high $tca_retract_concurrent_title_interaction$#! [interaction|E] on [kingdom|E]-tier concurrent offices without requiring the [son_of_heaven|E]'s approval"
 tca_diarch_admin_rectification_level_1_bullet: "•$tca_diarch_admin_rectification_level_1$\n"
 tca_diarch_admin_rectification_level_3_bullet: "•$tca_diarch_admin_rectification_level_3$\n"
 tca_diarch_admin_rectification_level_4_bullet: "•$tca_diarch_admin_rectification_level_4$\n"
 tca_diarch_admin_rectification_level_empty: ""

 ##################################################
 # Character Interaction: Rectify Subordination (归正辖属)
 ##################################################
 tca_rectify_subordination_interaction: "Rectify Subordination"
 tca_rectify_subordination_interaction_desc: "Transfer [recipient.GetShortUIName] to the jurisdiction of [recipient.GetHerHis] de jure superior in accordance with imperial administrative statutes."
 tca_rectify_subordination_interaction_send: "Order Subordination Rectification"
 tca_rectify_subordination_notification: "[actor.GetTitledFirstName] has rectified your administrative subordination, placing you under your de jure superior."

 # Rectify Subordination: Conditions & Blockers
 tca_rectify_subordination_actor_eligible_tt: "Must be the serving [son_of_heaven|E] or [grand_secretariat_director|E]"
 tca_rectify_subordination_recipient_eligible_tt: "[recipient.GetShortUIName] must be a landed Celestial local official (duchy- or county-tier) within the same realm"
 tca_rectify_subordination_de_jure_liege_exists_tt: "The de jure superior office of [recipient.GetPrimaryTitle.GetName] must have a current holder"
 tca_rectify_subordination_liege_mismatch_tt: "[recipient.GetShortUINamePossessive] current direct liege ([recipient.GetLiege.GetTitledFirstName]) differs from the holder of [recipient.GetHerHis] de jure superior office ([recipient.GetPrimaryTitle.GetDeJureLiege.GetHolder.GetTitledFirstName])"
 tca_rectify_subordination_same_top_liege_tt: "The holder of the de jure superior office must share the same [top_liege|E] as [recipient.GetShortUIName]"
 tca_rectify_subordination_valid_tier_tt: "The de jure superior holder must hold a higher primary title tier than [recipient.GetShortUIName] without creating a vassalage loop"
 tca_rectify_subordination_cross_jurisdiction_tt: "[recipient.GetShortUIName] holds concurrent offices or counties across multiple jurisdictions, so a direct transfer would create new jurisdictional mismatches; use #high $tca_retract_concurrent_title_interaction$#! first"
 tca_admin_rectification_pending_in_flight_tt: "[recipient.GetShortUIName] already has an administrative rectification directive in transit; you must await their confirmation before issuing further directives"
 tca_admin_rectification_diarch_direct_vassal_blocked_tt: "The [scales_of_power|E] favor the [son_of_heaven|E] (below #V 40#!), preventing the [grand_secretariat_director|E] from rectifying direct [vassals|E] of the [son_of_heaven|E]"

 # Rectify Subordination: Effect Preview
 tca_rectify_subordination_effect_tt: "Issue an administrative order to [recipient.GetShortUIName]: change [recipient.GetHerHis] direct [liege|E] from [recipient.GetLiege.GetTitledFirstName] to [recipient.GetPrimaryTitle.GetDeJureLiege.GetHolder.GetTitledFirstName] ([recipient.GetPrimaryTitle.GetDeJureLiege.GetName]), without altering held [titles|E] or [de_jure|E] borders"

 ##################################################
 # Character Interaction: Retract Concurrent Title (裁撤兼领)
 ##################################################
 tca_retract_concurrent_title_interaction: "Retract Concurrent Office"
 tca_retract_concurrent_title_interaction_desc: "Retract an improperly held concurrent local office or extra-jurisdictional county from [recipient.GetShortUIName] and appoint a qualified official to assume the post."
 tca_retract_concurrent_title_interaction_send: "Order Office Retraction"
 tca_request_retract_concurrent_title_interaction: "Request Concurrent Office Retraction"
 tca_request_retract_concurrent_title_interaction_desc: "Memorialize [intermediary.GetTitledFirstName] for approval to retract an improperly held concurrent local office or extra-jurisdictional county from [recipient.GetShortUIName] and appoint a qualified official to assume the post."
 tca_request_retract_concurrent_title_interaction_send: "Submit Memorial for Retraction"
 tca_retract_concurrent_title_prompt: "Select a concurrent local office or extra-jurisdictional county to retract and transfer to a qualified successor"
 tca_retract_concurrent_title_notification: "[actor.GetTitledFirstName] has retracted your concurrent holding of [target.GetName] and appointed a new official to the post."
 tca_retract_concurrent_title_approval_notification: "[actor.GetTitledFirstName] requests approval to retract [target.GetName] from [recipient.GetShortUIName] and appoint a new official."

 # Retract Concurrent Title: Title Selection & Exemptions
 tca_retract_concurrent_has_any_eligible_title_tt: "[recipient.GetShortUIName] holds at least one concurrent local office or extra-jurisdictional county subject to retraction"
 tca_retract_concurrent_title_is_secular_local_tt: "[target.GetName] must be a kingdom- or duchy-tier local office or a county-tier domain title (excluding noble family, judicial, tongpan, fengci, or retirement titles)"
 tca_retract_concurrent_not_primary_title_tt: "[target.GetName] is [recipient.GetShortUINamePossessive] [primary_title|E] and cannot be retracted as a concurrent holding"
 tca_retract_concurrent_not_capital_duchy_tt: "[target.GetName] is the [de_jure|E] duchy of [recipient.GetShortUINamePossessive] [realm_capital|E] ([recipient.GetCapitalLocation.GetTitle.GetDeJureLiege.GetNameNoTier]), which is a permitted concurrent holding"
 tca_retract_concurrent_county_outside_primary_de_jure_tt: "[target.GetName] lies within the [de_jure|E] jurisdiction of [recipient.GetShortUINamePossessive] primary title ([recipient.GetPrimaryTitle.GetName]) and is not extra-jurisdictional"
 tca_retract_concurrent_county_not_sole_capital_tt: "[target.GetName] is [recipient.GetShortUINamePossessive] [realm_capital|E] county, and [recipient.GetSheHe] holds no personal counties within the [de_jure|E] jurisdiction of [recipient.GetPrimaryTitle.GetName], granting it a capital exemption"
 tca_retract_concurrent_county_count_tier_capital_tt: "[recipient.GetShortUIName] is a county-tier official, and [recipient.GetHerHis] [realm_capital|E] ([recipient.GetCapitalLocation.GetTitle.GetDeJureLiege.GetName]) is not subject to concurrent retraction"
 tca_retract_concurrent_kingdom_requires_approval_tt: "The [scales_of_power|E] do not yet favor the [grand_secretariat_director|E] (below #V 60#!), so retracting a [kingdom|E]-tier concurrent office requires approval from the [son_of_heaven|E]"
 tca_retract_concurrent_kingdom_direct_allowed_tt: "The [scales_of_power|E] favor the [grand_secretariat_director|E] (at least #V 60#!), allowing direct retraction without imperial approval"

 # Retract Concurrent Title: Effect Preview
 tca_retract_concurrent_title_effect_tt: "Issue an administrative order to [recipient.GetShortUIName]: retract [target.GetName], transfer it directly to a qualified successor selected under imperial appointment rules, and rectify related vassal subordination without incurring [tyranny|E] or granting [claims|E]"
 tca_request_retract_concurrent_title_effect_tt: "Upon approval by [intermediary.GetTitledFirstName], issue an administrative order to [recipient.GetShortUIName]: retract [target.GetName], transfer it directly to a qualified successor selected under imperial appointment rules, and rectify related vassal subordination without incurring [tyranny|E] or granting [claims|E]"

 ##################################################
 # Imperial Approval Breakdown & Notifications
 ##################################################
 tca_admin_rectification_approval_yes: "#T [intermediary.GetTitleAsNameNoTooltip] will approve the memorial#!"
 tca_admin_rectification_approval_no: "#T [intermediary.GetTitleAsNameNoTooltip] will reject the memorial#!"
 tca_admin_rectification_approval_maybe: "#T [intermediary.GetTitleAsNameNoTooltip] may approve the memorial: $VALUE|0/%$#!"
 tca_admin_rectification_approval_institutional_reason: "Rectifying improper concurrent holdings upholds imperial statutes: $VALUE|=+0$"
 tca_admin_rectification_approval_actor_opinion: "[intermediary.GetShortUINamePossessive] opinion of [actor.GetShortUIName]: $VALUE|=+0$"
 tca_admin_rectification_approval_target_opinion: "[intermediary.GetShortUINamePossessive] opinion of [recipient.GetShortUIName]: $VALUE|=+0$"
 tca_admin_rectification_approval_scales_reason: "Current [scales_of_power|E]: $VALUE|=+0$"
 tca_admin_rectification_cannot_refuse_reason: "Administrative rectification is a central prerogative that local officials cannot refuse: $VALUE|=+0$"

 tca_admin_rectification_approved_toast: "Administrative Rectification Approved"
 tca_admin_rectification_approved_message: "[intermediary.GetTitledFirstName] approved your memorial and ordered the retraction of [target.GetName] from [recipient.GetShortUIName]."
 tca_admin_rectification_vetoed_toast: "Administrative Rectification Rejected"
 tca_admin_rectification_vetoed_message: "[intermediary.GetTitledFirstName] rejected your memorial to retract [target.GetName] from [recipient.GetShortUIName]."
 tca_admin_rectification_invalidated_toast: "Administrative Rectification Invalidated"
 tca_admin_rectification_invalidated_message: "Because the relevant titles or jurisdictional relations have changed, the administrative rectification regarding [recipient.GetShortUIName] was not executed."

 ##################################################
 # Letter Event: Rectify Subordination (tca_admin_rectification.10)
 ##################################################
 tca_admin_rectification.10.t: "Order to Rectify Subordination"
 tca_admin_rectification.10.desc.emperor: "By imperial statute, every office has its proper jurisdiction and chain of command. Although you currently hold [recipient.GetPrimaryTitle.GetName], which by law belongs under the jurisdiction of [scope:tca_rectify_new_liege_title.GetName], you have hitherto reported directly to [scope:tca_rectify_old_liege.GetTitledFirstName]. By this decree, you are henceforth placed under the direct supervision of [scope:tca_rectify_new_liege.GetTitledFirstName]. Your current office and seat of governance remain unchanged."
 tca_admin_rectification.10.desc.diarch: "The Grand Secretariat has reviewed the realm's administrative hierarchy: circuits, prefectures, and counties must adhere strictly to their statutory lines of subordination. Although you hold [recipient.GetPrimaryTitle.GetName], which belongs within the jurisdiction of [scope:tca_rectify_new_liege_title.GetName], you have hitherto been subordinated to [scope:tca_rectify_old_liege.GetTitledFirstName]. By order of the Council of State, you are hereby transferred to the direct supervision of [scope:tca_rectify_new_liege.GetTitledFirstName], while retaining your current post and seat."
 tca_admin_rectification.10.a: "I shall comply with the directive."
 tca_admin_rectification.10.a.tt: "Your direct liege changes from [scope:tca_rectify_old_liege.GetTitledFirstName] to [scope:tca_rectify_new_liege.GetTitledFirstName] ([scope:tca_rectify_new_liege_title.GetName]); your held titles and seat remain unchanged."
 tca_admin_rectification.10.invalid: "Circumstances have changed; this order no longer applies."
 tca_admin_rectification.10.invalid.tt: "Because the relevant titles or subordination relations have already changed, this rectification will not be executed."

 ##################################################
 # Letter Event: Retract Concurrent Office (tca_admin_rectification.20)
 ##################################################
 tca_admin_rectification.20.t: "Order to Retract Concurrent Office"

 # Opening: Emperor direct decree vs. Emperor-approved memorial vs. Grand Chancellor direct directive
 tca_admin_rectification.20.opening.emperor: "Local governance requires dedicated responsibility; holding excessive concurrent posts or governing counties beyond one's statutory borders inevitably impairs administration. While serving in [scope:tca_retract_primary_title.GetName], you have also concurrently held [scope:tca_retract_target_title.GetName], which contravenes our dynastic statutes on concurrent offices."
 tca_admin_rectification.20.opening.approved: "Upon the memorial of [actor.GetTitledFirstName]: local officials must attend to their proper jurisdictions and should not indefinitely hold multiple posts or govern counties across circuit boundaries. Your concurrent holding of [scope:tca_retract_target_title.GetName] alongside [scope:tca_retract_primary_title.GetName] has been reviewed by the court and approved by imperial decree for retraction."
 tca_admin_rectification.20.opening.diarch: "The Grand Secretariat has reviewed local office holdings: statutory boundaries and responsibilities must remain clear. Your concurrent holding of [scope:tca_retract_target_title.GetName] alongside [scope:tca_retract_primary_title.GetName] does not fall within the statutory exemptions for concurrent offices, and the Council of State hereby orders its retraction."

 # Body: Office retraction vs. County retraction vs. Stepping down from last landed post
 tca_admin_rectification.20.body.office: "\n\nThe court has selected a qualified official, [scope:tca_retract_successor.GetTitledFirstName], to assume [scope:tca_retract_target_title.GetName]. Upon receipt of this directive, you are to hand over the seals, archives, and subordinate jurisdictions of that office, and devote yourself to your primary post."
 tca_admin_rectification.20.body.county: "\n\nA governor's direct domain must remain within the statutory bounds of their primary office. The court has appointed [scope:tca_retract_successor.GetTitledFirstName] to govern [scope:tca_retract_target_title.GetName]. Upon receipt of this directive, you are to transfer the seals and registers of that county while remaining in your primary office."
 tca_admin_rectification.20.body.unlanded: "\n\nThe court has appointed [scope:tca_retract_successor.GetTitledFirstName] to assume [scope:tca_retract_target_title.GetName]. Once the handover is complete, as you hold no other landed post, you shall step down from active governance and await future appointment."

 tca_admin_rectification.20.a: "Hand over the office as ordered."
 tca_admin_rectification.20.a.tt: "You transfer [scope:tca_retract_target_title.GetName] to the newly appointed official [scope:tca_retract_successor.GetTitledFirstName], while retaining your remaining lawful titles and merit rank."
 tca_admin_rectification.20.invalid: "Circumstances have changed; this order no longer applies."
 tca_admin_rectification.20.invalid.tt: "Because the relevant titles or subordination relations have already changed, this retraction will not be executed."
