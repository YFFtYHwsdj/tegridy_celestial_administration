l_english:
 tca_frontier_support.1.opening: "To [ROOT.Char.GetTitledFirstNameNoTooltip],"
 tca_frontier_support.1.desc: "[tca_fs_letter_attacker.GetTitledFirstName] has declared war on me and threatens our borderlands. I ask you to send aid against the invader."
 tca_frontier_support.1.a: "I will send aid."
 tca_frontier_support.1.b: "I cannot send aid now."
 tca_frontier_support.1.delay: "Pledge support and join the defenders in approximately [SCOPE.GetValue('tca_fs_letter_delay')|0] days."
 tca_frontier_support.2.desc: "I cannot pledge troops at this time. I ask that you weigh the situation and make other arrangements."
 tca_frontier_support.2.a: "Understood."
 tca_frontier_support_pledged_title: "A Neighbor Pledges Support"
 tca_frontier_support_pledged_desc: "[tca_fs_notice_person.GetTitledFirstName] has pledged aid and will join the defenders in approximately [SCOPE.GetValue('tca_fs_notice_delay')|0] days."
