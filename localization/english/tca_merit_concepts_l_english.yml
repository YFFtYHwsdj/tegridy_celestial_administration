l_english:
 # 功绩升品百科；完整规则在概念中维护，浮窗只显示当前处境。
 game_concept_tca_merit_annual_review: "Annual Review"
 game_concept_tca_merit_annual_review_desc: "The annual review is the January assessment for official advancement under Celestial government. Civil and military officials are reviewed separately, and ordinary advancement proceeds one rank at a time from Rank 9 to Rank 3.\n\n#bold Eligibility#!\nOfficials must be ranked adults, meet the next rank's merit threshold, and hold the appropriate [tca_merit_qualification_cap|E]. Retired officials, those who declined office, and other ineligible characters do not participate. Each person may receive at most one ordinary advancement per year; changing service branch or realm does not create another opportunity.\n\n#bold Selection#!\nAdvancement from Rank 9 to Rank 8 has no quota: every eligible official advances, though it still takes effect through the annual review rather than immediately. From Rank 8 to Rank 7 onward, advancement competes for places. Places depend on the number of registered officials at each rank and the court's staffing targets; meeting the threshold does not guarantee advancement. Among competitors of the same source rank, greater merit improves the chance of selection; places are neither awarded strictly in merit order nor drawn with equal chances. Small courts may have years with no places.\n\n#bold Results#!\nUnsuccessful candidates retain their merit and may continue accumulating it for later reviews. Successful advancement resets merit to the threshold of the newly granted rank, from which accumulation resumes. Advancement does not automatically appoint the recipient to a new office.\n\n#bold Beyond Rank 3#!\nAnnual review stops at Rank 3. Ranks 2 and 1 require [tca_merit_central_grant|E]; merit and examination success alone cannot grant them."
 game_concept_tca_merit_qualification_cap: "Advancement Qualification Ceiling"
 game_concept_tca_merit_qualification_cap_desc: "The advancement qualification ceiling is the highest rank that an official's examination results and entry qualifications permit them to compete for in the [tca_merit_annual_review|E]. It differs from the [merit_level|E] already held: qualification permits ordinary advancement, while actual advancement still requires sufficient merit and other conditions.\n\n#bold Celestial qualification tiers#!\n$EFFECT_LIST_BULLET$No examination: Rank 9.\n$EFFECT_LIST_BULLET$Provincial Examination or an equivalent entry qualification: Rank 8.\n$EFFECT_LIST_BULLET$Metropolitan or Palace Examination: Rank 3.\n\nThe Palace Examination confers the same advancement qualification as the Metropolitan Examination (Rank 3) and does not raise the ceiling further; it only improves competition for civil appointments. For other entry routes, the character's actual qualifications determine the ceiling.\n\n#bold Qualification and rank#!\nQualification marks what may be competed for; ordinary review itself grants no rank above Rank 3. Even Metropolitan or Palace Examination graduates with ample merit require [tca_merit_central_grant|E] for Ranks 2 and 1.\n\nPassing an examination or gaining a qualification does not immediately grant the corresponding rank, and losing a qualification does not automatically remove a rank already held. Qualification only limits subsequent ordinary advancement; central appointment grants ignore this ceiling.\n\nThis concept applies to Celestial government. [meritocratic|E] government retains advancement through accumulated merit within examination limits and does not use Celestial annual review."
 game_concept_tca_merit_central_grant: "Central Appointment Grant"
 game_concept_tca_merit_central_grant_desc: "Central appointment grants confer rank for actually holding central office under Celestial government, providing Ranks 2 and 1 beyond ordinary [tca_merit_annual_review|E].\n\n$EFFECT_LIST_BULLET$A Six Ministry central office grants Rank 2.\n$EFFECT_LIST_BULLET$Chancellor, Censor, or Grand Marshal grants Rank 1.\n\nThese grants require neither the next merit threshold nor the [tca_merit_qualification_cap|E]. Lower-ranked and even unranked appointees may receive the corresponding rank directly, without advancing through intermediate ranks. A Rank 3 official can therefore receive Rank 1 directly.\n\nGrants do not consume annual review places. An official already advanced through ordinary review may still receive a higher rank for central appointment that year. After receiving a central grant, the recipient cannot receive ordinary advancement again in that year.\n\nA character holding the same or a higher rank receives no further advancement. Appointment to a lower office does not lower rank, and leaving office does not revoke it. When rank actually rises, merit resets to the new rank's threshold and accumulation resumes.\n\nRank and office remain distinct: a high rank does not guarantee continued employment or waive the existing requirements and political consequences of central appointment."
