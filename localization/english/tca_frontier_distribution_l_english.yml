l_english:
 tca_frontier_distribution.1.t:0 "The Newly Won Lands"
 tca_frontier_distribution.1.desc:0 "The war is over, and the newly conquered counties are now in my hands. I can retain them within my realm or hand them over to my superiors."
 tca_frontier_distribution.1.a:0 "Retain the lands"
 tca_frontier_distribution.1.a.tt:0 "Keep the lands gained in this conquest."
 tca_frontier_distribution.1.b:0 "Hand them to my liege"
 tca_frontier_distribution.1.b.tt:0 "Transfer the lands gained in this conquest to [scope:tca_fb_batch.Var('tca_fb_liege').Char.GetShortUIName]."
 tca_frontier_distribution.1.c:0 "Hand them to my top liege"
 tca_frontier_distribution.1.c.tt:0 "Transfer the lands gained in this conquest to [scope:tca_fb_batch.Var('tca_fb_country').Title.GetHolder.GetShortUIName]."
