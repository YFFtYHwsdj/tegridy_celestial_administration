l_english:
 tca_treaty_war.opening:0 "[sender.Custom2('AppropriateGreeting', ROOT.Char)]"
 tca_treaty_war.1.desc:0 "I have taken up arms against [scope:tca_treaty_dispute.Var('tca_treaty_opponent').Char.GetTitledFirstName]. Our interests at the border are at stake, yet the court still has a treaty with them. I await your instructions."
 tca_treaty_war.1.stop:0 "Order an immediate withdrawal. Uphold the treaty."
 tca_treaty_war.1.allow:0 "Let the campaign continue. The treaty is at an end."
 tca_treaty_war.2.desc:0 "Our treaty with [scope:tca_treaty_dispute.Var('tca_treaty_opponent').Char.GetTitledFirstName] remains in force. You must cease this offensive and withdraw from the fighting immediately."
 tca_treaty_war.2.obey:0 "I shall obey and withdraw at once."
 tca_treaty_war.2.refuse:0 "The campaign demands otherwise. I cannot obey."
 tca_treaty_war.break.tt:0 "The treaty ends, and the sovereign suffers the prestige penalties for breaking a truce."
 tca_treaty_war.obey.tt:0 "If you lead the offensive, the war ends in a white peace. If you joined as an ally, only you leave the war."
