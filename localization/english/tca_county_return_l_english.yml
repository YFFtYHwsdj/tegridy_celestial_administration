l_english:
 tca_return_excess_county_decision: "Relinquish a Concurrent County"
 tca_return_excess_county_decision_desc: "The tax registers, lawsuits, and daily dispatches of a single county are enough to occupy a local magistrate from dawn till dusk. Holding several jurisdictions piles their ledgers and petitions onto one desk, leaving me stretched thin between them. Rather than govern from afar with divided attention, I can relinquish one of these holdings to a new official and devote myself to my own post and seat."
 tca_return_excess_county_decision_tooltip: "Relinquish a concurrently held county to a new official"
 tca_return_excess_county_decision_confirm: "Relinquish"
 tca_county_return_over_limit_tt: "Your domain exceeds its current limit"
 tca_county_return_no_pending_tt: "You have no unfinished county handover, administrative rectification, or retirement petition"
 tca_county_return_effect_tt: "Hand over the selected county’s seal and registers to a new official."
 tca_county_return_pending_title: "County Handover"
 tca_county_return_pending_desc: "The seal and registers of [tca_vcr_notice_title.GetName] are being put in order for the handover."
 tca_county_return_done_title: "County Handover Complete"
 tca_county_return_done_desc: "[tca_vcr_transfer_successor.GetShortUIName] has taken over [tca_vcr_transfer_title.GetName]. With the seal and registers handed over, you may now devote yourself to your own post."
 tca_county_return_failed_title: "County Handover Called Off"
 tca_county_return_failed_desc: "The handover could not be completed. Any county not yet transferred remains with its current holder."
 tca_county_return_partial_title: "County Handed Over; Jurisdiction Unsettled"
 tca_county_return_partial_desc: "[tca_vcr_transfer_title.GetName] has been handed over to [tca_vcr_transfer_successor.GetShortUIName], though the new official's administrative subordination remains unsettled."
 tca_county_return_failed_office_desc: "As your office or circumstances have changed, this county handover has been cancelled."
 tca_county_return_failed_realm_desc: "Your sovereign has changed, so this county handover has been cancelled."
 tca_county_return_failed_limit_desc: "Your direct domain now falls within the statutory limit, so there is no longer any need to relinquish a county."
 tca_county_return_failed_target_desc: "The county in question has either changed hands or become your primary post or seat of governance, and can no longer be relinquished."
 tca_county_return_failed_conflict_desc: "With another administrative reassignment or retirement petition now underway, the handover of this county has been set aside."
 tca_county_return_failed_timeout_desc: "The seal and registers could not be handed over in time, so the transfer has been called off."
 tca_county_return_in_progress_desc: "The seal and registers of [GetPlayer.MakeScope.Var('tca_county_return_title').Title.GetName] are being put in order for the new official."
 tca_return_excess_county_decision_no_item_selected: "Choose a county to relinquish"
