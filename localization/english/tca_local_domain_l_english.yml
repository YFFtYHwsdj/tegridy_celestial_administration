l_english:
 tca_local_domain_policy_law: "Concurrent Provincial Administration"
 tca_local_domain_policy_law_singular: "$tca_local_domain_policy_law$"
 tca_local_domain_policy_law_desc: "The court determines whether civil and military governors may administer several provinces directly. This law does not restrict the sovereign's domain limit."
 tca_local_domain_original_law: "Appointments by Ability"
 tca_local_domain_original_law_desc: "The court sets no fixed limit, entrusting capable governors with the administration of further provinces.\n\n$EFFECT_LIST_BULLET$No additional domain limit is imposed on Civil Governors or Military Governors."
 tca_local_domain_civil_law: "Separate Civil Administration"
 tca_local_domain_civil_law_desc: "Civil governors should give their full attention to governing the people; the court grants greater latitude to commanders of its armies.\n\n$EFFECT_LIST_BULLET$Civil Governors have a domain limit of 1; Military Governors are exempt from this restriction."
 tca_local_domain_all_law: "Separate Civil and Military Administration"
 tca_local_domain_all_law_desc: "The court applies the same rule to civil and military governors: each shall govern one place, without concurrently administering another province.\n\n$EFFECT_LIST_BULLET$Civil Governors and Military Governors both have a domain limit of 1."
 tca_local_domain_subject_law: "Provincial Administration Law"
 tca_local_domain_subject_law_singular: "$tca_local_domain_subject_law$"
 tca_local_domain_subject_law_desc: "A governor's domain is subject to the law established by the court."
 tca_local_domain_unrestricted_law: "Appointments by Ability"
 tca_local_domain_unrestricted_law_desc: "The existing domain limit rules remain in force."
 tca_local_domain_restricted_law: "Separate Provincial Administration"
 tca_local_domain_restricted_law_desc: "Provincial administration law limits the governor's domain to 1."
 tca_local_domain_reform_cooldown: "Provincial administration was recently reformed. It may be reconsidered on [GetCurrentDateWithDiff(GetVarTimeRemaining(THIS.Char.MakeScope, 'tca_local_domain_reform_cooldown'))]."
 tca_test_local_domain_capacity: "Domain Capacity Test Baseline"
 tca_test_local_domain_capacity_desc: "Used only to verify domain capacity in a disposable test game."
