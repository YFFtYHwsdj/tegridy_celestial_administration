 tca_central_opinion_level_1: "\n\n•The Emperor’s opinion carries the most weight in succession to central offices.\n"
 tca_central_opinion_level_2: "\n\n•The Emperor’s opinion carries more weight in central office succession, with the Secretary Director’s opinion also taken into account.\n"
 tca_central_opinion_level_3: "\n\n•The Emperor’s and the Secretary Director’s opinions carry equal weight in central office succession.\n"
 tca_central_opinion_level_4: "\n\n•Central office succession favors the Secretary Director’s opinion while still giving weight to the Emperor’s.\n"
 tca_central_opinion_level_5: "\n\n•The Secretary Director’s opinion carries more weight in central office succession, with the Emperor’s opinion also taken into account.\n"
 tca_central_opinion_level_6: "\n\n•The Secretary Director’s opinion carries the most weight in succession to central offices.\n"
