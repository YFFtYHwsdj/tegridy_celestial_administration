l_english:
 # Only appends Administrative Rectification permission bullets to Scales of Power Levels 1, 3, and 4 when viewing a Grand Secretariat (grand_secretariat) diarchy; all other diarchy types remain identical to vanilla.
 DIARCHY_WINDOW_SCALES_OF_POWER_LEVEL_TOOLTIP: "#T [scales_of_power|E] Level $LEVEL$#!\n$STATUS$\n\nEffects:\n$POWERS$[AddTextIf( And( GetScriptedGui('tca_grand_secretariat_diarchy_details').IsShown( GuiScope.AddScope( 'tca_diarchy_owner', DiarchyWindow.GetDiarchyOwner.MakeScope ).End ), EqualTo_int32( '(int32)$LEVEL|q$', '(int32)1' ) ), '$tca_diarch_admin_rectification_level_1_bullet|q$' )][AddTextIf( And( GetScriptedGui('tca_grand_secretariat_diarchy_details').IsShown( GuiScope.AddScope( 'tca_diarchy_owner', DiarchyWindow.GetDiarchyOwner.MakeScope ).End ), EqualTo_int32( '(int32)$LEVEL|q$', '(int32)3' ) ), '$tca_diarch_admin_rectification_level_3_bullet|q$' )][AddTextIf( And( GetScriptedGui('tca_grand_secretariat_diarchy_details').IsShown( GuiScope.AddScope( 'tca_diarchy_owner', DiarchyWindow.GetDiarchyOwner.MakeScope ).End ), EqualTo_int32( '(int32)$LEVEL|q$', '(int32)4' ) ), '$tca_diarch_admin_rectification_level_4_bullet|q$' )][SelectLocalization( EqualTo_int32( '(int32)$LEVEL|q$', '(int32)1'), '', '#weak All previous levels also apply#!' )]\n\n$CHANGE_DESC$"
