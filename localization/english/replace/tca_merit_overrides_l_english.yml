l_english:
 # 功绩与官品原版文本覆盖；天朝规则显式区分，贤能制保留原义。
 game_concept_merit_desc: "Merit records a character's accumulated achievements and contributes to competition in the Celestial [tca_merit_annual_review|E]. Reaching the next threshold is only one requirement and does not automatically change [merit_level|E].\n\nAll characters with an [elder|E] or [disciples|E] produce a passive $game_concept_merit$ gain.\n\n[governors|E] can increase their $game_concept_merit$ by constructing [buildings|E] in their assigned [holdings|E], going on an [inspection|E] [activity|E], participating in a [GetActivityType('activity_debate').GetName] and attending [examinations|E].\n\n[GetSubjectContractType( 'celestial_provinces' ).GetObligationNameShort( 'celestial_province_standard' )] governors increase their monthly merit gain by paying more [taxes|E] to their [liege|E], while [GetSubjectContractType( 'celestial_provinces' ).GetObligationNameShort( 'celestial_province_military' )] governors increase it by creating [men_at_arms|E].\n\nNon-$game_concept_governors$ can attempt to increase it by attending [examinations|E].\n\nCelestial officials with sufficient merit still need the appropriate [tca_merit_qualification_cap|E] and selection in annual review. Ranks 2 and 1 require [tca_merit_central_grant|E]. [meritocratic|E] government retains advancement through accumulated merit within examination limits."
 game_concept_merit_level_desc: "Merit rank is a rank already held, recorded separately from an actual office. It affects appointment competition and existing rank benefits. Advancement does not automatically grant a new office, and leaving office does not automatically remove rank.\n\nUnder Celestial government, examinations and other entry routes provide Rank 9. Eligible officials advance one rank at a time through [tca_merit_annual_review|E] up to Rank 3. Beyond that, a Six Ministry central office grants Rank 2, while Chancellor, Censor, or Grand Marshal grants Rank 1 directly; see [tca_merit_central_grant|E].\n\nCurrent rank records what has been granted; the [tca_merit_qualification_cap|E] describes what examinations and entry qualifications permit. Higher qualifications or more merit do not immediately change current rank. [meritocratic|E] government retains advancement through accumulated merit within examination limits.\n\nThe ranks are:\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_0' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_1' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_2' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_3' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_5' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_6' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_7' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_8' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_9' ).GetNameWithTooltip|L]"
 game_concept_imperial_examination_desc: "The $game_concept_imperial_examinations$ hold a key role in the [government_bureaucratic_type|E] functions of [GetGovernment('celestial_government').GetName|E] and [GetGovernment('meritocratic_government').GetName|E] [governments|E]. \n\nExaminations provide entry and advancement qualifications; rank advancement and appointment to an actual office retain their separate requirements. \n\nThe examination levels are: \n#indent_newline:2 $EFFECT_LIST_BULLET$#bold Children's#!: Parents can have their children take the examination from the age of [EmptyScope.ScriptValue('child_exam_min_age')] through the $send_child_to_examination_interaction$ [interaction|E].#! \n#indent_newline:2 $EFFECT_LIST_BULLET$#bold Provincial#!: Characters who are not [landed|E] may attempt the second level of Examinations through the [GetActivityType('activity_local_examination').GetName] [activity|E].#! \n#indent_newline:2 $EFFECT_LIST_BULLET$#bold Metropolitan#!: Held by the [GetGovernment('celestial_government').GetName|E] [government|E] through the [GetActivityType('activity_imperial_examination').GetName] activity.#! \n#indent_newline:2 $EFFECT_LIST_BULLET$#bold Palace#!: The final [EmptyScope.ScriptValue('metropolitan_exam_final_entrants_loc')] entrants at the $activity_imperial_examination$ are invited to a feast at the royal palace, to meet and show their worth to the [son_of_heaven|E].#!\n\n$tca_merit_exam_qualification_note$\n\nMeritocratic government still uses examinations to raise the native rank limit, allowing advancement through accumulated merit within that limit."
 game_concept_provincial_examination_desc: "The second level [imperial_examinations|E], taken via the [GetActivityType('activity_local_examination').GetName] [activity|E].\n\n#S When passed:#!\n[GetModifier( 'tgp_passed_provincial_exam_modifier' ).GetDescWithEffects].\n\n$tca_merit_exam_qualification_note$\n\nMeritocratic government still uses examinations to raise the native rank limit, allowing advancement through accumulated merit within that limit."
 game_concept_metropolitan_examination_desc: "The third level [imperial_examinations|E]. Held by the [GetGovernment('celestial_government').GetName|E] [government|E] through the [GetActivityType('activity_imperial_examination').GetName] [activity|E].\n\n#S When passed:#!\n[GetModifier( 'tgp_passed_metropolitan_exam_modifier' ).GetDescWithEffects].\n\n$tca_merit_exam_qualification_note$\n\nMeritocratic government still uses examinations to raise the native rank limit, allowing advancement through accumulated merit within that limit."
 game_concept_palace_examination_desc: "The fourth and final [imperial_examinations|E]. The final [EmptyScope.ScriptValue('metropolitan_exam_final_entrants_loc')] entrants at the [GetActivityType('activity_imperial_examination').GetName] are invited to a feast at the royal palace, to kowtow and show their worth to the [son_of_heaven|E].\n\n#S When passed:#!\n[GetModifier( 'tgp_passed_palace_exam_modifier' ).GetDescWithEffects].\n\n$tca_merit_exam_qualification_note$\n\nMeritocratic government still uses examinations to raise the native rank limit, allowing advancement through accumulated merit within that limit."
 game_concept_merit_pool_desc: "A $game_concept_merit_pool$ contains all potential [characters|E] who are eligible to gain [titles|E] with certain types of [appointment|E].\n\nCandidates are sorted based on their [candidate_score|E]. Some [appointment_succession_laws|E] use [merit|E], which will sort the candidates by their [merit_level|E] first and $game_concept_candidate_score$ second.\n\nWhen the [holder|E] of a Title with $game_concept_appointment$ dies, the Title will pass to the highest ranking character in the list. If the character holds a Title already, the Title must have higher a higher [appointment_prominence|E], otherwise it will pass to the next character.\n\nCelestial appointment uses the [merit_level|E] already held, not the [tca_merit_qualification_cap|E]. An office candidate list is not the [tca_merit_annual_review|E] pool; rank advancement and appointment to a particular office remain separate."
 tca_merit_native_marker_tooltip: "#T [GetMeritLevelNameNoTooltip( ComplexBarItem.GetIndex )]#!\nRequires [GetMeritLevelThreshold( ComplexBarItem.GetIndex )|V^] $game_concept_merit$\n\n[GetMeritModifierByLevel( ComplexBarItem.GetIndex ).GetDescWithBulletPointEffects][AddTextIf( GreaterThan_int32( ComplexBarItem.GetIndex, '(int32)1' ), '\n' )]$BULLET$[movement_power|E]: [movement_power_i] [Multiply_int32( ComplexBarItem.GetIndex, '(int32)10' )|+=0]\n[GetMaxAppointmentRankDescription( 'merit', ComplexBarItem.GetIndex )][Character.GetMeritLevelDescription( ComplexBarItem.GetIndex )]"
 tca_merit_central_marker_tooltip: "#T [GetMeritLevelNameNoTooltip( ComplexBarItem.GetIndex )]#!\n\n[GetMeritModifierByLevel( ComplexBarItem.GetIndex ).GetDescWithBulletPointEffects][AddTextIf( GreaterThan_int32( ComplexBarItem.GetIndex, '(int32)1' ), '\n' )]$BULLET$[movement_power|E]: [movement_power_i] [Multiply_int32( ComplexBarItem.GetIndex, '(int32)10' )|+=0]\n[GetMaxAppointmentRankDescription( 'merit', ComplexBarItem.GetIndex )][Character.GetMeritLevelDescription( ComplexBarItem.GetIndex )]"
 MERIT_PROGRESSBAR_MARKER_TOOLTIP: "[SelectLocalization(And(EqualTo_CFixedPoint(Character.MakeScope.ScriptValue('tca_merit_exam_scale_value'), '(CFixedPoint)0'), GreaterThan_int32(ComplexBarItem.GetIndex, '(int32)7')), 'tca_merit_central_marker_tooltip', 'tca_merit_native_marker_tooltip')]"
 tca_merit_native_overflow_tt: "#weak Merit gained while at Merit limit will be counted towards higher levels once the Examinations are passed.#!"
 MERIT_CAP_OVERFLOW_WILL_COUNT: "[SelectLocalization(EqualTo_CFixedPoint(Character.MakeScope.ScriptValue('tca_merit_exam_scale_value'), '(CFixedPoint)0'), 'tca_merit_overflow_tt', 'tca_merit_native_overflow_tt')]"
 tca_merit_native_exam_would_take: "\n\n[Character.GetShortUINamePossessive|U] maximum [merit_level|E] is limited by not having passed this [examination|E]. [SelectLocalization(Character.IsLocalPlayer, 'EXAMINATION_WOULD_TAKE_ME', 'EXAMINATION_WOULD_TAKE_OTHER')]"
 EXAMINATION_WOULD_TAKE: "[SelectLocalization(EqualTo_CFixedPoint(Character.MakeScope.ScriptValue('tca_merit_exam_scale_value'), '(CFixedPoint)0'), 'tca_merit_exam_would_take', 'tca_merit_native_exam_would_take')]"
 MERIT_TOOLTIP_EXAMINATION_PASSED_PROVINCIAL_EXAM: "@provincial_exam_icon! #T Provincial Examination#!\n[SelectLocalization( HasPassedProvincialExamination(Character), 'EXAMINATION_PASSED', SelectLocalization(HasFailedProvincialExamination(Character),'EXAMINATION_FAILED','EXAMINATION_NOT_TAKEN') )]\n\n#S When passed:#!\n[GetModifier( 'tgp_passed_provincial_exam_modifier' ).GetDescWithBulletPointEffects]\n\nHeld by government officials at the [GetActivityType('activity_local_examination').GetName] [activity|E]\n\n$tca_merit_exam_qualification_note$"
 MERIT_TOOLTIP_EXAMINATION_PASSED_METROPOLITAN_EXAM: "@metropolitan_exam_icon! #T Metropolitan Examination#!\n[SelectLocalization( HasPassedMetropolitanExamination(Character), 'EXAMINATION_PASSED', SelectLocalization(HasFailedMetropolitanExamination(Character),'EXAMINATION_FAILED','EXAMINATION_NOT_TAKEN') )]\n\n#S When passed:#!\n[GetModifier( 'tgp_passed_metropolitan_exam_modifier' ).GetDescWithBulletPointEffects]\n\nHeld by the [GetGovernment('celestial_government').GetName|E] [government|E] at the [GetActivityType('activity_imperial_examination').GetName] [activity|E]\n\n$tca_merit_exam_qualification_note$"
 MERIT_TOOLTIP_EXAMINATION_PASSED_PALACE_EXAM: "@palace_exam_icon! #T Palace Examination#!\n[SelectLocalization( HasPassedPalaceExamination(Character), 'EXAMINATION_PASSED', 'EXAMINATION_NOT_TAKEN' )]\n\n#S When passed:#!\n[GetModifier( 'tgp_passed_palace_exam_modifier' ).GetDescWithBulletPointEffects]\n\nHeld before [son_of_heaven|E] at the [GetActivityType('activity_imperial_examination').GetName] [activity|E]\n\n$tca_merit_exam_qualification_note$"
 celestial_government_merit_level_0_description: "\n\nEnter service through [imperial_examinations|E]. Passing raises qualifications without granting the highest permitted rank directly."
 celestial_government_merit_level_1_description: "\n\nExaminations and other entry routes provide Rank 9. Subsequent ordinary advancement requires the appropriate [tca_merit_qualification_cap|E], sufficient merit, and selection in [tca_merit_annual_review|E]."
 celestial_government_merit_level_2_description: "\n\nThis rank and subsequent ordinary advancement require the appropriate [tca_merit_qualification_cap|E], sufficient merit, and selection in [tca_merit_annual_review|E]. Qualification is not a rank already granted."
 celestial_government_merit_level_3_description: "\n\nThis rank and subsequent ordinary advancement require the appropriate [tca_merit_qualification_cap|E], sufficient merit, and selection in [tca_merit_annual_review|E]. Qualification is not a rank already granted."
 celestial_government_merit_level_4_description: "\n\nThis rank and subsequent ordinary advancement require the appropriate [tca_merit_qualification_cap|E], sufficient merit, and selection in [tca_merit_annual_review|E]. Qualification is not a rank already granted."
 celestial_government_merit_level_5_description: "\n\nThis rank and subsequent ordinary advancement require the appropriate [tca_merit_qualification_cap|E], sufficient merit, and selection in [tca_merit_annual_review|E]. Qualification is not a rank already granted."
 celestial_government_merit_level_6_description: "\n\nThis rank and subsequent ordinary advancement require the appropriate [tca_merit_qualification_cap|E], sufficient merit, and selection in [tca_merit_annual_review|E]. Qualification is not a rank already granted."
 celestial_government_merit_level_7_description: "\n\nRank 3 is the end of [tca_merit_annual_review|E]. A Six Ministry central office grants Rank 2; Chancellor, Censor, or Grand Marshal grants Rank 1 directly. See [tca_merit_central_grant|E]."
 celestial_government_merit_level_8_description: "\n\nRank 2 is obtained through [tca_merit_central_grant|E] without requiring Palace Examination qualifications. Chancellor, Censor, or Grand Marshal grants Rank 1; merit alone does not grant advancement."
 celestial_government_merit_level_9_description: "\n\nRank 1 is the highest rank, obtained through [tca_merit_central_grant|E] without requiring Palace Examination qualifications and retained after leaving office."
