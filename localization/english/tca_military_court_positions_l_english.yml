 # 军事宫廷职位
 tca_military_supervisor_court_position: "Military Supervisor"
 tca_military_supervisor_court_position_desc: "Assists prefectural and military district governors with levy replenishment, fortifications and garrisons."

 tca_military_inspector_court_position: "Military Controller"
 tca_military_inspector_court_position_desc: "Assists the governor with levy replenishment and field drills to keep troops ready for service."

 tca_corps_inspector_court_position: "Chief Disciplinarian"
 tca_corps_inspector_court_position_desc: "Serves under senior commanders, encouraging troops and organizing their movements in battle and on the march."

 # 职位资格要求
 tca_cannot_hold_multiple_military_court_positions: "Does not already hold another military court position"
 tca_must_be_in_official_rank: "Must be a ranked official (Rank 9 or above)"
 tca_must_be_unlanded_official: "Must be an unlanded courtier of this court"
 tca_must_have_basic_martial: "Must possess martial knowledge (Martial at least 6)"
 tca_cannot_appoint_military_court_position_manually: "Imperial Commission: Appointed solely through Imperial Court selection"

 # 称职度特质描述
 tca_court_position_commander_trait: "Has Commander Trait"

