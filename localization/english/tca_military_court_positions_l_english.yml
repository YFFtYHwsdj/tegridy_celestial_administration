l_english:
 # Military Court Positions
 tca_military_supervisor_court_position: "Military Supervisor"
 tca_military_supervisor_court_position_desc: "The $tca_military_supervisor_court_position$ is stationed in prefectures and military districts (Zhou and Jun), responsible for inspecting troop camps, patrolling border forts, suppressing local banditry, and maintaining fortresses. It provides unassigned military officials with vital field experience in garrison logistics and local defense."

 tca_military_inspector_court_position: "Military Controller"
 tca_military_inspector_court_position_desc: "The $tca_military_inspector_court_position$ is appointed in circuits, commanderies, and major duchy administrations, tasked with large-scale drill, armory maintenance, and strategic troop readiness. The holder ensures that regional regiments remain disciplined and combat-ready."

 tca_corps_inspector_court_position: "Chief Disciplinarian"
 tca_corps_inspector_court_position_desc: "The $tca_corps_inspector_court_position$ oversees army march discipline, knight command, martial law, and parade formation. Operating under supreme military commanders, this office enforces strict martial statutes and ensures all vanguard and cavalry formations act in concert."

 # Position Eligibility Requirements
 tca_cannot_hold_multiple_military_court_positions: "Does not already hold another military court position"
 tca_must_be_in_official_rank: "Must be a ranked official (Rank 9 or above)"
 tca_must_be_unlanded_official: "Must be an unlanded courtier of this court"
 tca_must_have_basic_martial: "Must possess martial knowledge (Martial at least 6)"
 tca_cannot_appoint_military_court_position_manually: "Imperial Commission: Appointed solely through Imperial Court selection"

 # Aptitude Trait Descriptions
 tca_court_position_commander_trait: "Has Commander Trait"

 # Military Court Position Tasks
 tca_military_supervisor_drill_levies: "Drill Levies"
 tca_military_supervisor_drill_levies_desc: "Oversee and drill local levies and rural militias, maintaining base defenses and steady troop replenishment."

 tca_military_supervisor_order_barracks: "Order Barracks"
 tca_military_supervisor_order_barracks_desc: "Audit cantonment provisions, standardize supply expenses, eliminate waste, and reinforce camp discipline."

 tca_military_supervisor_inspect_defenses: "Inspect Defenses"
 tca_military_supervisor_inspect_defenses_desc: "Inspect forts, ramparts, and border posts, bolstering garrison vigilance and defensive preparedness."

 tca_military_inspector_drill_troops: "Drill Standing Troops"
 tca_military_inspector_drill_troops_desc: "Conduct rigorous field formations and combat drills, honing troop morale and combat effectiveness."

 tca_military_inspector_maintain_gear: "Maintain Arms & Armor"
 tca_military_inspector_maintain_gear_desc: "Repair armaments, inspect arsenals, reduce equipment upkeep costs, and keep elite soldiers in top fighting order."

 tca_military_inspector_inspect_troops: "Review Muster Rolls"
 tca_military_inspector_inspect_troops_desc: "Audit muster rolls, verify troop numbers, and ensure ready muster and rapid replenishment."

 tca_corps_inspector_encourage_officers: "Exhort Officers & Knights"
 tca_corps_inspector_encourage_officers_desc: "Exhort field commanders and elite knights, sharpening their combat fervor to spearhead the frontline."

 tca_corps_inspector_enforce_discipline: "Enforce Military Discipline"
 tca_corps_inspector_enforce_discipline_desc: "Strictly uphold martial law and punishments, forging unwavering cohesion and unyielding battle lines."

 tca_corps_inspector_marshal_ranks: "Marshal Marching Columns"
 tca_corps_inspector_marshal_ranks_desc: "Coordinate marching routes, deploy forward scouts, and maintain rapid transit across distant theaters."

  # Imperial Commission Notifications
  tca_military_appointment_message_title: "Imperial Commission Appointed"
  tca_military_appointment_message_desc: "The Bureau of Military Affairs and Ministry of Personnel have concluded regular reviews, commissioning [tca_chosen_officer.GetShortUIName] to take up office in our administration to drill regiments and secure the borders."
  tca_military_promotion_departure_message_title: "Imperial Promotion & Transfer"
  tca_military_promotion_departure_message_desc: "Upon assessing military records and administrative merit, the Imperial Court has promoted [tca_chosen_officer.GetShortUIName] to a senior commission, transferring [tca_chosen_officer.GetHerHim] to serve under [target_liege.GetShortUIName]."
  tca_military_appointment_cooldown_tt: "Serving Commission: Eligible for promotion after two years of service"
