 tca_military_inspector_maintain_gear: "Maintain Arms & Armor"
 tca_military_inspector_maintain_gear_desc: "This task has been discontinued."

 tca_military_inspector_inspect_troops: "Review Muster Rolls"
 tca_military_inspector_inspect_troops_desc: "This task has been discontinued."

 tca_corps_inspector_encourage_officers: "Encourage the Troops"
 tca_corps_inspector_encourage_officers_desc: "Encourages every rank to fight with resolve, increasing army damage."

 tca_corps_inspector_enforce_discipline: "Enforce Military Discipline"
 tca_corps_inspector_enforce_discipline_desc: "This task has been discontinued."

 tca_corps_inspector_marshal_ranks: "Marshal Marching Columns"
