 tca_merit_grant.2.rank_8: "The lingering chill of the new year has not yet faded when this year's review documents reach my hands. Since first entering Rank 9, every duty fulfilled and every daily task has been entered upon my service rolls, earning me this first writ of advancement at last. As I unroll the fresh writ of Rank 8, the ink is scarcely dry—still modest in the vast bureaucracy, yet I have finally shed the rawness of a newcomer and found firm footing in the court's ranks."
 tca_merit_grant.2.rank_7: "After long years of service in Rank 8, I have seen too many able colleagues with thick stacks of service records languish year after year on the lower rolls. When the January review results are posted this year, my name stands out among the candidates at last, advancing from Rank 8 to Rank 7. Stepping across this threshold leaves the junior ranks behind; henceforth, whether appointed to govern a prefecture or awaiting selection to a high commission, the road ahead opens far wider than before."
 tca_merit_grant.2.rank_6: "This year's review has been settled: the clerks examined my service records and evaluation rolls of recent years and approved my advancement from Rank 7 to Rank 6. At this standing, I am no longer the green newcomer poring anxiously over every draft; amidst routine dispatches and official dealings, a seasoned steadiness comes naturally. The new writ of Rank 6 feels neither light nor heavy in my hands—just weight enough to answer for years of diligent service."
 tca_merit_grant.2.rank_5: "Rank 5 marks a crucial divide in the court's hierarchy. With the approval of this January's review memorial, I am formally elevated from Rank 6 to Rank 5. Beyond this threshold, one is no longer an ordinary subordinate awaiting minor commissions, but stands among the court's senior officials—fit to take charge of a circuit and bear independent responsibility. Looking upon the newly issued writ on my desk, I feel all the more keenly the weight of trust placed behind the rank."
 tca_merit_grant.2.rank_4: "The higher one climbs in officialdom, the keener the rivalry among one's peers grows. This spring, the personnel office's memorial received approval to raise me from Rank 5 to Rank 4. Advancing ahead of so many veteran, respected colleagues rests not merely on deskbound toil, but on the deep standing built through years of affairs. Across court and province alike, Rank 4 is already a figure of real consequence, moving among the noted statesmen of the realm."
 tca_merit_grant.2.rank_3: "This January's review has come to its close, lifting me from Rank 4 to Rank 3. Looking back since first entering service, post after post and record after record have brought me to the summit of ordinary advancement. Rank 3 is already an exalted standing respected across the realm; beyond this, patient years and service records alone can carry no one further—only stepping into the Ministries or taking up the highest seats at court can open a higher horizon."
 tca_merit_grant.2.ordinary: "This January's review has concluded. Having examined my accumulated service records, the clerks have issued a new writ advancing me from $tca_merit_notice_source_rank$ to $tca_merit_notice_target_rank$. Years of earnest labor now stand duly entered as a tangible step forward upon the official rolls."
 tca_merit_grant.2.central: "With my appointment at the center newly confirmed, the court has issued an edict raising my rank in keeping with my high office, advancing me from $tca_merit_notice_source_rank$ to $tca_merit_notice_target_rank$. Having been chosen to oversee a central ministry, my rank rises at once with the dignity of the post. Taking up this new writ from the throne, I know the decisions henceforth upon my desk concern the governance of the entire realm."
 tca_merit_grant.2.rank_1: "Upon taking up one of the highest offices at the heart of government, a special imperial decree has elevated me from $tca_merit_notice_source_rank$ to Rank 1. Rank 1 is the utmost height a subject may attain, reserved for Chancellors who steer state affairs, Censors who uphold the laws, and Grand Marshals who command the armies. Reading the decree, past seasons of rise and toil pass before my eyes; standing now at the head of all officials, every word and act weighs upon the peace of the realm."
 tca_merit_grant.2.rank_1_initial: "Upon taking up one of the highest offices at the heart of government, a special imperial decree has broken with custom to confer Rank 1 directly upon me. Rising from unranked standing straight to the pinnacle of officialdom is almost unheard of at court; standing now at the head of all officials, only solid deeds can answer the sovereign's favor and quiet the doubts of the court."
 tca_merit_grant.2.civilian: "\n\nMy new rank has been entered upon the civil rolls of the Ministry of Personnel. Though taxes, lawsuits, and daily dispatches remain demanding, this added standing gives far surer footing for the road ahead in civil service."
 tca_merit_grant.2.civilian_mid: "\n\nThe personnel registers have been updated accordingly, and letters of congratulation from colleagues arrive in greater number. Among civil officials, such rank marks a mainstay of the bureaucracy; whenever the court selects prefectural governors or capable commissioners, my name will stand far more prominently on the list."
 tca_merit_grant.2.civilian_high: "\n\nAcross the entire civil service, those who reach such standing are rare indeed. The days of waiting anxiously before the selection hall for my name to be called lie far behind; numbered now among the court's senior civil ministers, every move carries its own quiet prestige and authority."
 tca_merit_grant.2.civilian_central: "\n\nTo sit among the great ministers and senior statesmen of the inner court is the highest distinction a civil official can know. Henceforth, moving between the palace halls and council chambers, every memorial endorsed by my brush will go forth as an imperial command to the prefectures of the realm."
 tca_merit_grant.2.military: "\n\nMy new rank has been inscribed upon the military selection rolls and muster registers. Drilling troops and inspecting city walls is hard service, yet with the court's formal recognition of merit, my standing for future military prefecture posts rests on far firmer ground."
 tca_merit_grant.2.military_mid: "\n\nThe registers of the Bureau of Military Affairs and the Ministry of Personnel have been revised together. Among military commanders and frontier administrators, this rank commands respect from unruly troops and gives weight to regional command—whether guarding a border stronghold or overseeing garrison affairs, my authority now stands much firmer."
 tca_merit_grant.2.military_high: "\n\nTo rise this far through the military rolls by service and merit is no small feat. On the rosters of the Bureau of Military Affairs and the regional commands, I now stand among a handful of seasoned senior generals whose banners subordinate officers look to with immediate obedience."
 tca_merit_grant.2.military_central: "\n\nTo stand at the center and oversee the military affairs of the entire realm is the summit every soldier looks up to across a lifetime. Imperial guards and frontier garrisons alike converge upon my desk; only measured deliberation can prove worthy of so exalted a rank."
 tca_merit_grant.2.cross: " This advancement carries me across a major threshold of rank, opening the way to higher commands and deliberations at court; the greater the honor, the greater the care it demands."
 tca_merit_grant.2.within: " Though a step within the same tier of service, it is earned by steady merit; by advancing in due order, higher responsibilities will come in time."
 tca_merit_grant.2.a: "I shall put the writ away and attend to my duties."
 tca_merit_approved_base_modifier: "Approved Rank"
 tca_merit_approved_reduction_modifier: "Confirmed Rank"
 tca_merit_grant.2.central_initial: "With my appointment at the center newly confirmed, the court has set aside the usual ladder of seniority and issued a writ directly conferring $tca_merit_notice_target_rank$ for my central duties. Stepping straight into the high ranks of the court without years of grinding through local posts is as rare a mark of favor as it is a sign that the eyes of court and province alike are now fixed upon me."
 tca_merit_courtier_cap_compensation_modifier: "Career Rank"
