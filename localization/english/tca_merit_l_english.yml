l_english:
 tca_merit_grant.2.t: "Advancement in Rank"
 tca_merit_grant.2.ordinary: "The annual review of merit is complete. My accumulated service has earned me advancement from rank [TopScope.GetValue('tca_merit_notice_source')|0] to rank [TopScope.GetValue('tca_merit_notice_target')|0]."
 tca_merit_grant.2.central: "With my appointment to central office confirmed, I have been granted the rank appropriate to my duties: from rank [TopScope.GetValue('tca_merit_notice_source')|0] to rank [TopScope.GetValue('tca_merit_notice_target')|0]."
 tca_merit_grant.2.civilian: "\n\nMy place among the civil officials is now established anew."
 tca_merit_grant.2.military: "\n\nMy place among the military officials is now established anew."
 tca_merit_grant.2.cross: " A new stage of my official career begins."
 tca_merit_grant.2.within: " This advancement marks another step in my service."
 tca_merit_grant.2.a: "I shall fulfill my duties."
 tca_merit_approved_base_modifier: "Approved Rank"
 tca_merit_approved_reduction_modifier: "Confirmed Rank"
 tca_merit_grant.2.central_initial: "With my appointment to central office confirmed, I have been granted rank [TopScope.GetValue('tca_merit_notice_target')|0], appropriate to my duties."
