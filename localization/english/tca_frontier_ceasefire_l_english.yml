l_english:
 tca_frontier_ceasefire.opening:0 "To [ROOT.Char.GetTitledFirstName],"
 tca_frontier_ceasefire.1.desc:0 "I have taken up arms against [scope:tca_fw_record.Var('tca_fw_defender').Char.GetTitledFirstName]. I write to report this new conflict on the frontier."
 tca_frontier_ceasefire.1.a:0 "Let the campaign proceed."
 tca_frontier_ceasefire.1.b:0 "Order an immediate end to the war."
 tca_frontier_ceasefire.2.desc:0 "You have taken up arms against [scope:tca_fw_record.Var('tca_fw_defender').Char.GetTitledFirstName]. The court has other plans. End this war and withdraw your forces."
 tca_frontier_ceasefire.obey:0 "I shall obey and end the war."
 tca_frontier_ceasefire.2.b:0 "I ask the court to compensate my expenses."
 tca_frontier_ceasefire.refuse:0 "I cannot obey. The campaign must continue."
 tca_frontier_ceasefire.3.desc:0 "I am willing to withdraw, but the campaign has already incurred expenses. Grant me [scope:tca_fw_record.Var('tca_fw_compensation').GetValue|0] [treasury|E] funds, and I shall obey the order to end the war."
 tca_frontier_ceasefire.3.a:0 "Pay the compensation and end the war."
 tca_frontier_ceasefire.3.b:0 "No compensation. The order stands."
 tca_frontier_ceasefire.4.desc:0 "Your request for compensation is denied. The order stands: withdraw your forces and end the war."
 tca_frontier_ceasefire.5.desc:0 "I have received the order to end the war. Yet the campaign remains unfinished, and I cannot withdraw now. I ask the court to understand."
 tca_frontier_ceasefire.5.a:0 "Let this refusal pass."
 tca_frontier_ceasefire.5.b:0 "Issue a reprimand."
 tca_frontier_ceasefire.5.c:0 "Deduct Merit and impose a fine."
 tca_frontier_ceasefire.5.d:0 "Remove all landed offices and impose a fine."
 tca_frontier_ceasefire.5.a.tt:0 "Impose no punishment."
 tca_frontier_ceasefire.5.b.tt:0 "[scope:tca_fw_record.Var('tca_fw_officer').Char.GetShortUIName] loses 100 Merit and retains all offices."
 tca_frontier_ceasefire.5.c.tt:0 "[scope:tca_fw_record.Var('tca_fw_officer').Char.GetShortUIName] loses 300 Merit and pays a fine equal to three months of personal gold income."
 tca_frontier_ceasefire.5.d.tt:0 "[scope:tca_fw_record.Var('tca_fw_officer').Char.GetShortUIName] loses 600 Merit, pays a fine equal to six months of personal gold income, and surrenders all landed titles while retaining the Noble Family and estate."
 tca_frontier_ceasefire.white_peace.tt:0 "End this war in a White Peace."
 tca_frontier_ceasefire.compensate.tt:0 "Pay the requested compensation from the Treasury and end this war in a White Peace."
 tca_frontier_ceasefire.refuse.tt:0 "Continue the war; the court may punish you immediately."
 tca_frontier_ceasefire.notice.opening:0 "To [ROOT.Char.GetTitledFirstName],"
 tca_frontier_ceasefire.6.stopped:0 "I have obeyed the order, withdrawn my forces, and ended the war in a White Peace."
 tca_frontier_ceasefire.6.pardoned:0 "Your refusal to obey will be forgiven this time. In future, give due regard to the commands of the court."
 tca_frontier_ceasefire.6.reprimanded:0 "For refusing to obey, you are reprimanded and lose 100 Merit."
 tca_frontier_ceasefire.6.fined:0 "For refusing to obey, you lose 300 Merit and pay a fine of [SCOPE.GetValue('tca_fw_notice_fine')|1] gold."
 tca_frontier_ceasefire.6.dismissed:0 "For refusing to obey, you are removed from your landed offices, lose 600 Merit, and pay a fine of [SCOPE.GetValue('tca_fw_notice_fine')|1] gold."
 tca_frontier_ceasefire.6.a:0 "Understood."
 tca_frontier_ceasefire.6.penalized:0 "For refusing to obey, you lose 300 Merit."
 tca_frontier_ceasefire.6.dismissed_no_fine:0 "For refusing to obey, you are removed from your landed offices and lose 600 Merit."
