l_english:
 tca_frontier_recovery_cb:0 "Frontier Recovery"
 tca_frontier_recovery_war:0 "[ATTACKER.GetShortUINamePossessive] Frontier Recovery War"
 tca_frontier_recovery_victory:0 "The lost counties are returned to their former holders."
 tca_frontier_recovery_failed:0 "The lost counties are not recovered."
 tca_frontier_recovery.opening:0 "To [ROOT.Char.GetTitledFirstName],"
 tca_frontier_recovery.notice.opening:0 "News from the Frontier"
 tca_frontier_recovery.1.desc:0 "Our border counties have fallen to [scope:tca_fs_record.Var('tca_fs_attacker').Char.GetTitledFirstName]. You pledged your aid before; will you now lead a war to recover these lands for their former holders?"
 tca_frontier_recovery.1.a:0 "I will lead the recovery."
 tca_frontier_recovery.1.a.tt:0 "Begin a recovery war immediately. Victory returns the lost counties directly to their former holders."
 tca_frontier_recovery.1.b:0 "This is no time for another war."
 tca_frontier_recovery.2.desc:0 "Our border counties have fallen, and I have begun a war to recover them. Will you lend your aid?"
 tca_frontier_recovery.2.a:0 "My forces will join you in seven days."
 tca_frontier_recovery.2.a.tt:0 "Join this recovery war in seven days."
 tca_frontier_recovery.2.b:0 "I cannot join you this time."
 tca_frontier_recovery.3.none:0 "No recovery war could be organized. The lost counties remain beyond our reach for now."
 tca_frontier_recovery.3.started:0 "[scope:tca_fs_record.Var('tca_fd_leader').Char.GetTitledFirstName] has begun a recovery war. Victory will restore the lost counties to their former holders."
 tca_frontier_recovery.3.failed:0 "The recovery war has ended without restoring the lost counties."
 tca_frontier_recovery.3.returned:0 "The recovery war has been won, and the lost counties have been returned to their former holders."
 tca_frontier_recovery.3.a:0 "Understood."
