l_english:
 tca_court_offer.1.opening: "[target_liege.Custom2('AppropriateGreeting', ROOT.Char)]"
 tca_court_offer.1.desc: "The position of [ROOT.Char.Custom('tca_court_offer_position_name')] in my court is vacant, and I invite you to take it up. If you agree, your noble house will come directly under my authority, and you will receive the salary attached to the position. I await your reply within thirty days."
 tca_court_offer.1.accept: "I will take up the appointment."
 tca_court_offer.1.accept_tt: "Accept the appointment and become a direct vassal of [target_liege.GetShortUIName]. You remain under this office after leaving the position, until another assignment or formal appointment changes your allegiance."
 tca_court_offer.1.decline: "I must decline this time."
 tca_court_offer.1.decline_tt: "Decline this invitation. You will receive no further assignment invitations for one year."
 tca_court_offer.1.expired: "Understood."
 tca_court_offer.3.t: "An Appointment Withdrawn"
 tca_court_offer.3.desc: "The proposed appointment can no longer be granted. The invitation has been withdrawn."
 tca_court_offer.position_default: "[SCOPE.GetFlagName('tca_court_offer_position_label')]"
