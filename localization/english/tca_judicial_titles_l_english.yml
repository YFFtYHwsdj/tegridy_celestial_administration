l_english:
 tca_judicial_title_name: "Judicial Commission of [tca_circuit.GetNameNoTierNoTooltip]"
 tca_judicial_title_adj: "Judicial Commission"
 tca_judicial_holder: "Judicial Commissioner of [ROOT.Char.GetPrimaryTitle.MakeScope.Var('song_judicial_circuit').Title.GetNameNoTierNoTooltip]"
 tca_celestial_duke_holder_male: "[CHARACTER.Custom('TCAJudicialHolderTitle')]"
 tca_celestial_duke_holder_female: "[CHARACTER.Custom('TCAJudicialHolderTitle')]"
 tca_view_judicial_titles_decision: "View Judicial Titles"
 tca_view_judicial_titles_decision_desc: "View judicial titles associated with circuits held by you and your subjects. Each title appears in notifications with its coat of arms, including effective title succession, holder realm and gender laws, and the native UI IsDestroyedOnSuccession result (true/false)."
 tca_view_judicial_titles_decision_tooltip: "Show judicial titles in your realm"
 tca_view_judicial_titles_decision_confirm: "View"
 tca_judicial_title_view_message: "[tca_viewed_title.GetNameNoTooltip]"
 tca_judicial_title_view_message_desc: "Associated circuit: [tca_viewed_circuit.GetName]. Select the coat of arms to inspect the title. Vacant positions do not appear in the character list of vassals."
 tca_test_judicial_appointment_decision: "Test Initial Judicial Appointment"
 tca_test_judicial_appointment_decision_desc: "Fill vacant judicial offices. Select an existing non-historical unlanded character in the same celestial realm who meets the duchy merit threshold, weighted by learning. Generate a native scholar only if no eligible candidate exists. Grant first, then use the native civilian realm succession law without a title-specific law. Sitting officers are retained. Maintenance repairs delete_on_destroy on existing offices. Also show current succession laws and IsDestroyedOnSuccession after maintenance (true/false). Use View Judicial Titles first to inspect the state before maintenance."
 tca_test_judicial_appointment_decision_tooltip: "Fill vacancies using merit eligibility and learning weights"
 tca_test_judicial_appointment_decision_confirm: "Run Test"
 tca_judicial_status_held: "Circuit: [tca_viewed_circuit.GetName]. Government: [tca_viewed_holder.GetGovernment.GetName]. Holder: [tca_viewed_holder.GetName]. Direct liege: [tca_viewed_actual_liege.GetName], matching the circuit holder. Check government, holder style and successors."
 tca_judicial_status_held_title: "[tca_viewed_title.GetNameNoTooltip]: Held"
 tca_judicial_status_wrong_liege_title: "[tca_viewed_title.GetNameNoTooltip]: Incorrect Direct Liege"
 tca_judicial_status_wrong_liege: "Circuit: [tca_viewed_circuit.GetName]. Holder: [tca_viewed_holder.GetName]. Actual liege: [tca_viewed_actual_liege.GetName]; expected: [tca_viewed_circuit.GetHolder.GetName]. Reattachment has not produced the intended relationship; inspect the log."
 tca_judicial_status_independent: "Circuit: [tca_viewed_circuit.GetName]. Holder: [tca_viewed_holder.GetName] is independent; expected liege: [tca_viewed_circuit.GetHolder.GetName]. Inspect the log."
 tca_judicial_succession_message_title: "[tca_viewed_title.GetNameNoTooltip]: Succession Diagnostic"
 tca_judicial_succession_not_appointment: "The actual succession order of this office is not appointment. Inspect the holder's native civilian realm succession law and any remaining title-specific laws."
 tca_judicial_succession_has_heir: "This office uses appointment succession. Its own current_heir: [tca_viewed_office_heir.GetName]. This is the office successor, distinct from the character portrait heir. If candidates are absent in the title window, investigate the native appointment UI."
 tca_judicial_succession_no_heir: "This office uses appointment succession, but its own current_heir is absent. A successor has not been produced. Advance a few days and inspect again. If still absent, investigate the landless appointment pool and context."
 tca_judicial_status_vacant_title: "[tca_viewed_title.GetNameNoTooltip]: Vacant"
 tca_judicial_status_vacant: "Circuit: [tca_viewed_circuit.GetName]. The title has no holder. Run initial appointment. No title-specific succession law is added."
 tca_judicial_destroyed_on_succession_title: "[tca_viewed_title.GetNameNoTooltip]: Current Succession Destruction Result"
 tca_judicial_destroyed_on_succession_desc: "Circuit: [tca_viewed_circuit.GetName]. Valid title object: [Select_CString( tca_viewed_title.IsValid, 'true', 'false' )]. IsDestroyedOnSuccession = [Select_CString( tca_viewed_title.IsDestroyedOnSuccession, 'true', 'false' )]. This is the engine result used by the native title window: true shows no succession; false enters the normal succession section. This notification only reads the title. In the appointment test, the current result is read after maintenance. If the value is blank or the expression remains unresolved, inspect error.log; the read has not been verified."
 tca_judicial_succession_law_title: "[tca_viewed_title.GetNameNoTooltip]: Current Succession Laws"
 tca_judicial_succession_law_desc: "Effective title succession description:\n[tca_viewed_title.GetSuccessionDescription]\n\nHolder realm succession law: [tca_viewed_holder.GetActiveLawInGroupWithFlag('succession_order_laws').GetName].\nRealm gender law: [tca_viewed_holder.GetActiveLawInGroupWithFlag('succession_gender_laws').GetName].\nTitle has its own laws: [Select_CString( tca_viewed_title.HasLaws, 'true', 'false' )]. Title-specific succession laws can override realm laws; use the effective title description above for this office."
