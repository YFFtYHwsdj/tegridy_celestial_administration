l_english:
 tca_judicial_title_name: "Judicial Commission of [tca_circuit.GetNameNoTierNoTooltip]"
 tca_judicial_title_adj: "Judicial Commission"
 tca_judicial_holder: "Judicial Commissioner"
 tca_celestial_duke_holder_male: "[CHARACTER.Custom('TCAJudicialHolderTitle')]"
 tca_celestial_duke_holder_female: "[CHARACTER.Custom('TCAJudicialHolderTitle')]"
 tca_view_judicial_titles_decision: "View Judicial Titles"
 tca_view_judicial_titles_decision_desc: "Read-only diagnostics: effective law, succession result and full line, holder government and primary title, direct liege, office eligibility and IsDestroyedOnSuccession. Circuit-liege heirs receive a separate warning."
 tca_view_judicial_titles_decision_tooltip: "Show judicial titles in your realm"
 tca_view_judicial_titles_decision_confirm: "View"
 tca_judicial_title_view_message: "[tca_viewed_title.GetNameNoTooltip]"
 tca_judicial_title_view_message_desc: "Associated circuit: [tca_viewed_circuit.GetName]. Select the coat of arms to inspect the title. Vacant positions do not appear in the character list of vassals."
 tca_test_judicial_appointment_decision: "Test Judicial Maintenance and Replacement"
 tca_test_judicial_appointment_decision_desc: "Use native celestial civilian realm succession and remove the legacy judicial title law, restore names, CoAs and destruction flags, and repair direct lieges. Retain eligible incumbents; replace vacant, landed or multiple-office holders using the existing merit/learning pool, generating a scholar if needed. Transfer only the commission; outgoing holders retain land and family. Reports show the state after repair. Use View Judicial Titles first for a read-only baseline."
 tca_test_judicial_appointment_decision_tooltip: "Remove the legacy law, use native civilian succession, repair identity and lieges, and replace vacant or invalid office holders"
 tca_test_judicial_appointment_decision_confirm: "Run Test"
 tca_judicial_status_held: "Circuit: [tca_viewed_circuit.GetName]. Government: [tca_viewed_holder.GetGovernment.GetName]. Holder: [tca_viewed_holder.GetName]. Direct liege: [tca_viewed_actual_liege.GetName], matching the circuit holder. Check government, holder style and successors."
 tca_judicial_status_held_title: "[tca_viewed_title.GetNameNoTooltip]: Held"
 tca_judicial_status_wrong_liege_title: "[tca_viewed_title.GetNameNoTooltip]: Incorrect Direct Liege"
 tca_judicial_status_wrong_liege: "Circuit: [tca_viewed_circuit.GetName]. Holder: [tca_viewed_holder.GetName]. Actual liege: [tca_viewed_actual_liege.GetName]; expected: [tca_viewed_circuit.GetHolder.GetName]. Reattachment has not produced the intended relationship; inspect the log."
 tca_judicial_status_independent: "Circuit: [tca_viewed_circuit.GetName]. Holder: [tca_viewed_holder.GetName] is independent; expected liege: [tca_viewed_circuit.GetHolder.GetName]. Inspect the log."
 tca_judicial_succession_message_title: "[tca_viewed_title.GetNameNoTooltip]: Succession Diagnostic"
 tca_judicial_succession_not_appointment: "The office does not use appointment succession. Run maintenance to ensure the holder has native celestial civilian realm succession and remove the legacy judicial title law. If this persists, inspect other residual title laws."
 tca_judicial_succession_has_heir: "Current office heir: [tca_viewed_office_heir.GetName]. Primary title: [tca_viewed_office_heir.GetPrimaryTitle.GetName].\nNative cooldown date: [tca_viewed_office_heir.GetNewAppointmentCooldownDate.GetString]; reason: [tca_viewed_office_heir.GetAppointmentTimeoutText]. Uses native civilian appointment with recent-appointment cooldown. Same-tier transfers must also meet prominence and other native restrictions.\nAn heir may be a fallback rather than a normal appointment candidate; inspect the result type."
 tca_judicial_succession_no_heir: "The office has no current_heir. Native succession cannot guarantee an eligible merit candidate. Vacancy or ineligible-holder maintenance will appoint a replacement after succession."
 tca_judicial_status_vacant_title: "[tca_viewed_title.GetNameNoTooltip]: Vacant"
 tca_judicial_status_vacant: "Circuit: [tca_viewed_circuit.GetName]. No holder. Run judicial maintenance to appoint a commissioner, use native civilian realm succession and remove the legacy judicial title law."
 tca_judicial_destroyed_on_succession_title: "[tca_viewed_title.GetNameNoTooltip]: Current Succession Destruction Result"
 tca_judicial_destroyed_on_succession_desc: "Circuit: [tca_viewed_circuit.GetName]. Valid title object: [Select_CString( tca_viewed_title.IsValid, 'true', 'false' )]. IsDestroyedOnSuccession = [Select_CString( tca_viewed_title.IsDestroyedOnSuccession, 'true', 'false' )]. This is the engine result used by the native title window: true shows no succession; false enters the normal succession section. This notification only reads the title. In the appointment test, the current result is read after maintenance. If the value is blank or the expression remains unresolved, inspect error.log; the read has not been verified."
 tca_judicial_succession_law_title: "[tca_viewed_title.GetNameNoTooltip]: Current Succession Laws"
 tca_judicial_succession_law_desc: "Effective title law:\n[tca_viewed_title.GetSuccessionDescription]\n\nResult type: [tca_viewed_title.GetSuccessionResultTypeName]\n[tca_viewed_title.GetSuccessionResultTypeDesc]\nFull succession line:\n[tca_viewed_title.GetLineOfSuccessionDesc]\n\nHolder realm law: [tca_viewed_holder.GetActiveLawInGroupWithFlag('succession_order_laws').GetName]. Gender law: [tca_viewed_holder.GetActiveLawInGroupWithFlag('succession_gender_laws').GetName].\nTitle has its own laws: [Select_CString( tca_viewed_title.HasLaws, 'true', 'false' )]. The office now uses the holder's native civilian realm law. Maintenance removes the legacy judicial title law; family titles retain their native separate succession."
 tca_judicial_appointment_succession_law: "Dedicated Judicial Appointment"
 tca_judicial_appointment_succession_law_effects: "Uses the native celestial civilian merit appointment type, allowing same-tier promotions with native recent-appointment cooldown. Same-tier new positions must be more prominent. Normal transfers use appointment succession; replacement only repairs vacancies or invalid settled holders. Family succession remains native."
 tca_judicial_succession_liege_heir: "Warning: the circuit holder [tca_viewed_office_heir.GetName] is the current office heir. Inspect the result type for fallback_default. If the liege inherits, delayed maintenance appoints a dedicated replacement."
 tca_judicial_eligibility_title: "[tca_viewed_title.GetNameNoTooltip]: Holder Eligibility"
 tca_judicial_holder_eligible: "Eligible: [tca_viewed_holder.GetName] is an unlanded celestial duke with this commission as primary title and no other non-family titles. Direct liege is checked separately."
 tca_judicial_holder_ineligible: "Ineligible holder: [tca_viewed_holder.GetName]; primary title: [tca_viewed_holder.GetPrimaryTitle.GetName]. Requires an unlanded celestial duke holding only this commission and noble-family titles. Delayed, quarterly or manual maintenance appoints a replacement."
