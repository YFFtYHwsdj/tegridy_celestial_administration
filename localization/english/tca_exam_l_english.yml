l_english:
 tca_exam_commissioner_court_position:0 "Examination Commissioner"
 tca_exam_commissioner_court_position_desc:0 "Presides over the metropolitan and palace examinations and selects scholars for the court."
 tca_exam_commissioner_auto_exam:0 "Commissioner: Automatic Examination"
 tca_exam_commissioner_auto_exam_desc:0 "When the five-year term is due, asks the emperor whether to hold the examination."
 tca_exam_commissioner_manual_exam:0 "Commissioner: Ordinary Duties"
 tca_exam_commissioner_manual_exam_desc:0 "Does not request an examination; the emperor may still host the vanilla examination at any time."
 tca_exam.1.t:0 "A Petition to Hold the Examinations"
 tca_exam.1.desc:0 "The time has come to select scholars by examination. In accordance with established procedure, Examination Commissioner [commissioner.GetTitledFirstName] has submitted a petition and a memorandum of preparations. Officials of the Ministry of Rites and the responsible offices await my command below the steps.\n\nBefore I order the examination compound sealed, the court must settle this session's arrangements. Shall I preside over the metropolitan examination myself, or entrust its conduct to [commissioner.GetTitledFirstName]? If I delegate the task, should [commissioner.GetTitledFirstName] hold a Standard session, or a Small or Grand session according to the court's need for officials? Once the decree is issued, the responsible offices can proceed."
 tca_exam.1.focus_learning:0 "Learning"
 tca_exam.1.focus_martial:0 "Martial"
 tca_exam.1.focus_stewardship:0 "Stewardship"
 tca_exam.1.count:0 "Candidate pool: [ROOT.Char.MakeScope.Var('tca_exam_expected_entrants').GetValue|0]."
 tca_exam.1.scale_note:0 "The commissioner will determine the passing standard."
 tca_exam.1.option_small:0 "Let the commissioner preside over a Small session."
 tca_exam.1.option_standard:0 "Let the commissioner preside over a Standard session."
 tca_exam.1.option_grand:0 "Let the commissioner hold a Grand session to select more scholars."
 tca_exam.1.option_postpone:0 "Postpone the matter. We shall consider it later."
 tca_exam.1.delegate_tt:0 "The results will be calculated and reported after the examiners finish their work in the sealed compound.\nExamination focus: [host.Custom('tca_exam_focus_label')]\nEligible candidate pool: [host.MakeScope.Var('tca_exam_expected_entrants').GetValue|0]"
 tca_exam.1.postpone_tt:0 "No examination will be held this time. A further petition will be presented later."
 tca_exam.host_button:0 "I shall preside over this metropolitan examination myself."
 tca_exam.host_button_tt:0 "Proceed to the vanilla examination activity."
 tca_exam_cooldown_tt:0 "Less than five years since the last examination"
 tca_exam.2.t:0 "Metropolitan Examination Results"
 tca_exam.2.desc:0 "The examiners have completed their work within the sealed compound of the Ministry of Rites. Examination Commissioner [commissioner.GetTitledFirstName] presents the verified register for my inspection. The candidates' identities were concealed during marking, and their success or failure has now been determined under the rules set for this session.\n\n"
 tca_exam.2.passed:0 "I unfold the register. The successful candidates and their ranks have been settled, with [ROOT.Char.MakeScope.Var('tca_exam_top_1').Char.GetTitledFirstName] placed first. The register has been entrusted to the ritual officials, who await my command to post the results and arrange the palace proclamation.\n\n"
 tca_exam.2.no_pass:0 "Yet when I unfold the register, there are no successful candidates listed. Scholars attended this session, but after examination, not one met the required standard. Rather than fill the places with unqualified names, [commissioner.GetTitledFirstName] has reported the result as it stands. With no eligible candidates, there is no list to post, and the palace proclamation will not be held.\n\n"
 tca_exam.2.count:0 "[ROOT.Char.MakeScope.Var('tca_exam_pass_count').GetValue|0] candidates passed the metropolitan examination; [ROOT.Char.MakeScope.Var('tca_exam_failee_count').GetValue|0] failed."
 tca_exam.2.top_1:0 "First: [ROOT.Char.MakeScope.Var('tca_exam_top_1').Char.GetTitledFirstName]"
 tca_exam.2.top_2:0 "Second: [ROOT.Char.MakeScope.Var('tca_exam_top_2').Char.GetTitledFirstName]"
 tca_exam.2.top_3:0 "Third: [ROOT.Char.MakeScope.Var('tca_exam_top_3').Char.GetTitledFirstName]"
 tca_exam.2.top_4:0 "Fourth: [ROOT.Char.MakeScope.Var('tca_exam_top_4').Char.GetTitledFirstName]"
 tca_exam.2.top_5:0 "Fifth: [ROOT.Char.MakeScope.Var('tca_exam_top_5').Char.GetTitledFirstName]"
 tca_exam.2.top_6:0 "Sixth: [ROOT.Char.MakeScope.Var('tca_exam_top_6').Char.GetTitledFirstName]"
 tca_exam.2.top_7:0 "Seventh: [ROOT.Char.MakeScope.Var('tca_exam_top_7').Char.GetTitledFirstName]"
 tca_exam.2.top_8:0 "Eighth: [ROOT.Char.MakeScope.Var('tca_exam_top_8').Char.GetTitledFirstName]"
 tca_exam.2.top_9:0 "Ninth: [ROOT.Char.MakeScope.Var('tca_exam_top_9').Char.GetTitledFirstName]"
 tca_exam.2.top_10:0 "Tenth: [ROOT.Char.MakeScope.Var('tca_exam_top_10').Char.GetTitledFirstName]"
 tca_exam.2.a:0 "Approved. Post the results and prepare the palace proclamation."
 tca_exam.2.a_no_pass:0 "Understood. File the register in the usual manner."
 tca_exam.2.a_tt:0 "Proceed to the palace proclamation.\nSuccessful candidates: [host.MakeScope.Var('tca_exam_pass_count').GetValue|0]\nFirst in the metropolitan examination: [host.MakeScope.Var('tca_exam_top_1').Char.GetTitledFirstName]\nExamination focus: [host.Custom('tca_exam_focus_label')]"
 tca_exam.2.a_no_pass_tt:0 "This examination session ends without a palace proclamation.\nSuccessful candidates: 0\nExamination focus: [host.Custom('tca_exam_focus_label')]"
 tca_exam.3.t:0 "Palace Examination Results"
 tca_exam.3.desc:0 "The palace policy examination is over. The ceremonial attendants stand ready in the hall, while the successful scholars wait outside for the decree and the proclamation of their names.\n\nThe ritual officials present the register, and the herald calls out the names. First-ranked [ROOT.Char.MakeScope.Var('tca_exam_top_1').Char.GetTitledFirstName] receives the announcement before the throne. With the emperor presiding over the proclamation, the scholars on the register are formally granted the jinshi degree and become the acknowledged students of the Son of Heaven. Once the ceremony is complete, the register will be filed in the archives, and the new graduates will begin their careers in imperial service."
 tca_exam.3.first:0 "\n\n$BULLET$Zhuangyuan: [ROOT.Char.MakeScope.Var('tca_exam_top_1').Char.GetTitledFirstName]"
 tca_exam.3.second:0 "\n$BULLET$Bangyan: [ROOT.Char.MakeScope.Var('tca_exam_top_2').Char.GetTitledFirstName]"
 tca_exam.3.third:0 "\n$BULLET$Tanhua: [ROOT.Char.MakeScope.Var('tca_exam_top_3').Char.GetTitledFirstName]"
 tca_exam.3.a:0 "The ceremony is complete. File the register in the archives."
 tca_exam.3.a_tt:0 "This examination session concludes.\nScholars granted the jinshi degree: [host.MakeScope.Var('tca_exam_palace_count').GetValue|0]\nZhuangyuan: [host.MakeScope.Var('tca_exam_top_1').Char.GetTitledFirstName]"
 tca_exam.5.t:0 "No Candidates"
 tca_exam.5.desc:0 "The examination period has ended, yet the register Examination Commissioner [commissioner.GetTitledFirstName] presents to me contains not a single name. For a moment, the hall falls silent.\n\nThe compound was prepared according to procedure, and the examiners took their places behind its sealed gates. But by the end of the appointed period, no one had arrived to sit the examination. With the halls empty, there were no scholars to examine or select; [commissioner.GetTitledFirstName] could only report the facts. Neither the posting of results nor the palace proclamation will take place, and the ritual officials file the empty record in the usual manner."
 tca_exam.5.a:0 "Understood. File the record in the usual manner."
 tca_exam.5.a_tt:0 "This examination session ends.\nCandidates: 0 (no one sat this session)\nIntended focus: [host.Custom('tca_exam_focus_label')]"

 # 家族结果通知显式读取考生，避免继承皇帝的根作用域。
 tca_exam_family_failed_title:0 "[GetPlayer.Custom2('RelationToMeShort', tca_exam_result_candidate)|U] Failed Metropolitan Examination"
 tca_exam_family_failed_desc:0 "[tca_exam_result_candidate.GetShortUIName|U] fell short of the examiners' expectations at the Metropolitan Examination"
 tca_exam_family_metropolitan_title:0 "[GetPlayer.Custom2('RelationToMeShort', tca_exam_result_candidate)|U] Passed Metropolitan Examination"
 tca_exam_family_metropolitan_desc:0 "[tca_exam_result_candidate.GetShortUIName|U] successfully passed the Metropolitan Examination"
 tca_exam_family_palace_title:0 "[GetPlayer.Custom2('RelationToMeShort', tca_exam_result_candidate)|U] Passed Palace Examination"
 tca_exam_family_palace_desc:0 "[tca_exam_result_candidate.GetShortUIName|U] proved their worth at the Imperial Palace"
 tca_exam_not_serving_tt: "You do not hold an official post or serve as Examination Commissioner"
