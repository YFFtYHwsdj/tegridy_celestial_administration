l_english:
 tca_treasury_reserve_law_group: "Treasury Reserve Law"
 tca_treasury_reserve_law_group_singular: "$tca_treasury_reserve_law_group$"
 tca_treasury_reserve_law_group_desc: "The court sets a realm-wide reserve for official treasuries and an annual turnover at the start of the year. The Strict, Standard, and Lenient levels keep an absolute floor by title tier and up to twenty-four months of their highest recent monthly income; any surplus above that reserve is returned to the imperial treasury. The Exempt level stops the turnover altogether and places no reserve cap on official treasuries.\n\nFloors: County 250, Duchy 500, Kingdom 1000, Empire 2000.\n$EFFECT_LIST_BULLET$The first three levels scale only the floor; the twenty-four-month income cap is fixed.\n$EFFECT_LIST_BULLET$No transfer or notice is made below a surplus of 25."
 tca_treasury_reserve_strict_law: "Strict Reserve"
 tca_treasury_reserve_strict_law_desc: "Limits official treasuries tightly: the floor is three quarters of the standard amount, while the twenty-four-month income cap is unchanged.\n\n$EFFECT_LIST_BULLET$Suited to a court that seeks to concentrate fiscal power."
 tca_treasury_reserve_normal_law: "Standard Reserve"
 tca_treasury_reserve_normal_law_desc: "Official treasuries keep the standard floor and up to twenty-four months of retained income; the surplus is collected at the start of the year.\n\n$EFFECT_LIST_BULLET$The default institution at game start."
 tca_treasury_reserve_lenient_law: "Lenient Reserve"
 tca_treasury_reserve_lenient_law_desc: "Allows local offices a larger reserve: the floor is one and a half times the standard amount, while the twenty-four-month income cap is unchanged.\n\n$EFFECT_LIST_BULLET$Suited to a court that seeks to reassure the provinces."
 tca_treasury_reserve_exempt_law: "Exempt from Surplus"
 tca_treasury_reserve_exempt_law_desc: "Official treasuries no longer return their surplus at the start of the year; no reserve cap applies and the court does not reclaim excess treasury.\n\n$EFFECT_LIST_BULLET$Suited to a court that fully devolves fiscal power or suspends centralization."
 tca_treasury_reserve_reform_cooldown: "The reserve law was changed less than ten years ago"
 tca_treasury_reserve_emperor_briefing_title: "Annual Treasury Audit"
 tca_treasury_reserve_emperor_briefing_desc: "At the start of the year the realm's official treasuries were audited under the reserve law. The surplus returned to the imperial treasury totals [TopScope.GetValue('tca_tr_total')|0], from [TopScope.GetValue('tca_tr_count')|0] offices."
 tca_treasury_reserve_emperor_briefing_empty_desc: "At the start of the year the realm's official treasuries were audited under the reserve law. No office exceeded its reserve, so no surplus was returned this year."
 tca_treasury_reserve_emperor_briefing_tooltip: "At the start of the year, official treasuries are settled under the reserve law: each office keeps its title-tier floor and up to twenty-four months of retained income; the surplus is returned to the imperial treasury."
 tca_treasury_reserve_payer_notice_title: "Treasury Reserve"
 tca_treasury_reserve_payer_notice_desc: "Your office may retain [TopScope.GetValue('tca_tr_notice_cap')|0]; the surplus of [TopScope.GetValue('tca_tr_notice_amount')|0] has been returned to the imperial treasury."
 tca_treasury_reserve_payer_notice_tooltip: "At the start of the year the reserve law is settled: the office keeps its floor and up to twenty-four months of retained income; the surplus is returned to the imperial treasury."
