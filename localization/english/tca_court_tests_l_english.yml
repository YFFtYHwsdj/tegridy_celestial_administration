 tca_test_status_failed: "Completed: Some Cases Did Not Pass"
 tca_test_status_aborted_death: "Aborted: A Monitored Character Died"
 tca_test_status_aborted_environment: "Aborted: Test Environment or Sovereign Changed"
 tca_test_status_waiting: "Advance the game date to finish delayed cases."
 tca_test_status_progress: "Completed: [GetTitleByKey('h_china').MakeScope.Var('tca_test_status_completed').GetValue|0] / [GetTitleByKey('h_china').MakeScope.Var('tca_test_status_expected').GetValue|0]"
 tca_test_status_counts: "Passed [GetTitleByKey('h_china').MakeScope.Var('tca_test_status_passed').GetValue|0]   Failed [GetTitleByKey('h_china').MakeScope.Var('tca_test_status_failed').GetValue|0]   Skipped [GetTitleByKey('h_china').MakeScope.Var('tca_test_status_skipped').GetValue|0]"
