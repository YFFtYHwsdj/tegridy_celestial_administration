l_english:
 tca_run_tests_decision: "Debug: Run All Mod Tests"
 tca_test_arrest_office_name: "Temporary Landless Test Office"
 tca_run_tests_decision_desc: "Run all registered in-game script tests for this mod. Each group checks its own requirements; cases with unmet requirements count as not passed.\n\nTests may modify laws, characters and institutions. Use a disposable test game and do not save it as normal gameplay progress."
 tca_run_tests_decision_tooltip: "Run all mod tests and show a notification"
 tca_run_tests_decision_confirm: "Run All Tests"
 tca_run_tests_effect_tt: "Run all mod tests. A notification shows passed and not-passed counts and whether all cases passed. Details are written to debug.log."
 tca_tests_all_passed_title: "Mod Tests: All Passed"
 tca_tests_not_all_passed_title: "Mod Tests: Not All Passed"
 tca_tests_passed_desc: "Passed: [tca_test_reporter.MakeScope.Var('tca_test_suite_passed').GetValue|0]. Not passed: [tca_test_reporter.MakeScope.Var('tca_test_suite_not_passed').GetValue|0]."
 tca_tests_failed_desc: "Passed: [tca_test_reporter.MakeScope.Var('tca_test_suite_passed').GetValue|0]. Not passed: [tca_test_reporter.MakeScope.Var('tca_test_suite_not_passed').GetValue|0] (failed: [tca_test_reporter.MakeScope.Var('tca_test_suite_failed').GetValue|0]; skipped: [tca_test_reporter.MakeScope.Var('tca_test_suite_skipped').GetValue|0]). See TCA_TEST in debug.log."
 tca_tests_waiting_title: "Mod tests: waiting"
 tca_tests_waiting_desc: "Immediate tests have finished. Unpause and advance time; the final result appears after all delayed tests finish."

 trait_tca_test_death_protection: "Test Protection"
 trait_tca_test_death_protection_desc: "Protected from natural death during mod tests."

 tca_test_status_title: "Mod Tests"
 tca_test_status_running: "Running"
