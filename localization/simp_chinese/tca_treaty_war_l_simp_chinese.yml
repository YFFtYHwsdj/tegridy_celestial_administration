l_simp_chinese:
 tca_treaty_war.opening:0 "[sender.Custom2('AppropriateGreeting', ROOT.Char)]"
 tca_treaty_war.1.desc:0 "我已出兵与[scope:tca_treaty_dispute.Var('tca_treaty_opponent').Char.GetTitledFirstName]为敌。此战关乎边地利害，然而朝廷与其尚有和约，望明示当如何行事。"
 tca_treaty_war.1.stop:0 "传令罢兵，守住和约。"
 tca_treaty_war.1.allow:0 "听任其出兵，和约就此作罢。"
 tca_treaty_war.2.desc:0 "朝廷与[scope:tca_treaty_dispute.Var('tca_treaty_opponent').Char.GetTitledFirstName]所订和约仍然有效。你须立即停止此番进攻，退出战事，不得继续兴兵。"
 tca_treaty_war.2.obey:0 "谨遵命令，立即罢兵。"
 tca_treaty_war.2.refuse:0 "军情紧迫，恕难奉命。"
 tca_treaty_war.break.tt:0 "和约解除，君主承受撕毁停战的威望损失。"
 tca_treaty_war.obey.tt:0 "若你主持进攻，以白和平结束此战；若你是援军，只退出自己的参战。"
