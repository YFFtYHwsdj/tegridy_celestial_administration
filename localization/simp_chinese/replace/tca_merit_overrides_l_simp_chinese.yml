l_simp_chinese:
 # 功绩与官品原版文本覆盖；天朝规则显式区分，贤能制保留原义。
 game_concept_merit_desc: "功绩记录人物的积累与成就，也是天朝[tca_merit_annual_review|E]的竞争依据。达到下一品门槛只是升品条件之一，不会自动改变[merit_level|E]。\n\n所有拥有[elder|E]或[disciples|E]的角色会被动产生$game_concept_merit$。\n\n[governors|E]可以通过在辖区[holdings|E]修建[buildings|E]、进行[inspection|E][activity|E]、参与[GetActivityType('activity_debate').GetName]和参加[examinations|E]提高其$game_concept_merit$。\n\n[GetSubjectContractType( 'celestial_provinces' ).GetObligationNameShort( 'celestial_province_standard' )]官员向[liege|E]支付更多[taxes|E]可以提高每月功绩获得，而[GetSubjectContractType( 'celestial_provinces' ).GetObligationNameShort( 'celestial_province_military' )]官员组建[men_at_arms|E]可以提高每月功绩获得。\n\n非$game_concept_governors$可以通过参加[examinations|E]提高功绩。\n\n天朝官员积满功绩后，仍须具有相应[tca_merit_qualification_cap|E]并经铨叙获选。二品、一品依[tca_merit_central_grant|E]取得。[meritocratic|E]则保留在考试上限内依功绩积累晋级的规则。"
 game_concept_merit_level_desc: "官品是人物已经取得的品级，与实际担任的官职分别记录。官品影响任命竞争与原有品级待遇；升品本身不自动授予新官职，卸任也不自动失去官品。\n\n天朝九品沿考试等入仕途径取得；九品至三品之间，符合条件者通过[tca_merit_annual_review|E]逐品晋升。三品之后，出任六部中央职位可授二品；出任宰相、御史或大元帅可直接授一品，详见[tca_merit_central_grant|E]。\n\n当前官品表示已经获授的身份，[tca_merit_qualification_cap|E]表示考试与入仕身份允许竞争的范围。取得更高资格或积累更多功绩，都不会直接改变当前官品。[meritocratic|E]保留原版依功绩积累、在考试上限内晋级的方式。\n\n官品分别为：\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_0' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_1' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_2' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_3' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_5' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_6' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_7' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_8' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'merit_level_9' ).GetNameWithTooltip|L]"
 game_concept_merit: "功绩"
 game_concept_merit_level: "官品"
 game_concept_merit_levels: "官品"
 game_concept_imperial_examination_desc: "$game_concept_imperial_examinations$在[GetGovernment('celestial_government').GetName|E]和[GetGovernment('meritocratic_government').GetName|E][governments|E]的[government_bureaucratic_type|E]职能中起着关键作用。\n\n考试提供入仕与升品资格；官品晋升和实际官职任命仍须满足各自条件。\n\n科举等级分为：\n#indent_newline:2 $EFFECT_LIST_BULLET$#bold 童子试#!：父母可以通过$send_child_to_examination_interaction$[interaction|E]让其年满[EmptyScope.ScriptValue('child_exam_min_age')]岁的孩子参加的考试。#!\n#indent_newline:2 $EFFECT_LIST_BULLET$#bold 乡试#!：没[landed|E]的角色可以通过[GetActivityType('activity_local_examination').GetName][activity|E]参加的第二级考试。#!\n#indent_newline:2 $EFFECT_LIST_BULLET$#bold 会试#!：由[GetGovernment('celestial_government').GetName|E][government|E]统治者通过[GetActivityType('activity_imperial_examination').GetName]活动举办。#!\n#indent_newline:2 $EFFECT_LIST_BULLET$#bold 殿试#!：$activity_imperial_examination$中最终入围的[EmptyScope.ScriptValue('metropolitan_exam_final_entrants_loc')]名考生将获邀赴皇宫参加宴会，面见[son_of_heaven|E]并展现自身才华。#!\n\n$tca_merit_exam_qualification_note$\n\n贤能制仍依考试提高原版品级上限，积累功绩后可在上限内晋级。"
 game_concept_provincial_examination_desc: "第二级别的[imperial_examinations|E]，通过[GetActivityType('activity_local_examination').GetName][activity|E]参加。\n\n#S 通过后：#!\n[GetModifier( 'tgp_passed_provincial_exam_modifier' ).GetDescWithEffects]\n\n$tca_merit_exam_qualification_note$\n\n贤能制仍依考试提高原版品级上限，积累功绩后可在上限内晋级。"
 game_concept_metropolitan_examination_desc: "第三级别的[imperial_examinations|E]。由[GetGovernment('celestial_government').GetName|E][government|E]通过[GetActivityType('activity_imperial_examination').GetName][activity|E]举办。\n\n#S 通过后：#!\n[GetModifier( 'tgp_passed_metropolitan_exam_modifier' ).GetDescWithEffects]\n\n$tca_merit_exam_qualification_note$\n\n贤能制仍依考试提高原版品级上限，积累功绩后可在上限内晋级。"
 game_concept_palace_examination_desc: "第四以及最终级的[imperial_examinations|E]。[GetActivityType('activity_imperial_examination').GetName]的最终[EmptyScope.ScriptValue('metropolitan_exam_final_entrants_loc')]名考生受邀参加在皇宫举办的宴会，觐见[son_of_heaven|E]并展现自己的价值。\n\n#S 通过后：#!\n[GetModifier( 'tgp_passed_palace_exam_modifier' ).GetDescWithEffects]\n\n$tca_merit_exam_qualification_note$\n\n贤能制仍依考试提高原版品级上限，积累功绩后可在上限内晋级。"
 game_concept_merit_pool_desc: "$game_concept_merit_pool$囊括了有资格获得[titles|E][appointment|E]的所有潜在[characters|E]。\n\n候选人按照[candidate_score|E]排序。一些[appointment_succession_laws|E]使用[merit|E]，会先按照[merit_level|E]再按照$game_concept_candidate_score$为候选人排序。\n\n当$game_concept_appointment$头衔的[holder|E]死亡，头衔会传给列表中排名最靠前的角色。如果该角色已经持有头衔，新头衔必须比当前持有的头衔[appointment_prominence|E]更高，否则会传给下一顺位的角色。\n\n天朝任命所用的官品是人物已经取得的[merit_level|E]，并非[tca_merit_qualification_cap|E]。官职候选人列表也不是年度[tca_merit_annual_review|E]名单；升品与获得某一官职分别处理。"
 tca_merit_native_marker_tooltip: "#T [GetMeritLevelNameNoTooltip( ComplexBarItem.GetIndex )]#!\n需要[GetMeritLevelThreshold( ComplexBarItem.GetIndex )|V^]$game_concept_merit$\n\n[GetMeritModifierByLevel( ComplexBarItem.GetIndex ).GetDescWithBulletPointEffects][AddTextIf( GreaterThan_int32( ComplexBarItem.GetIndex, '(int32)1' ), '\n' )]$BULLET$[movement_power|E]：[movement_power_i][Multiply_int32( ComplexBarItem.GetIndex, '(int32)10' )|+=0]\n[GetMaxAppointmentRankDescription( 'merit', ComplexBarItem.GetIndex )][Character.GetMeritLevelDescription( ComplexBarItem.GetIndex )]"
 tca_merit_central_marker_tooltip: "#T [GetMeritLevelNameNoTooltip( ComplexBarItem.GetIndex )]#!\n\n[GetMeritModifierByLevel( ComplexBarItem.GetIndex ).GetDescWithBulletPointEffects][AddTextIf( GreaterThan_int32( ComplexBarItem.GetIndex, '(int32)1' ), '\n' )]$BULLET$[movement_power|E]：[movement_power_i][Multiply_int32( ComplexBarItem.GetIndex, '(int32)10' )|+=0]\n[GetMaxAppointmentRankDescription( 'merit', ComplexBarItem.GetIndex )][Character.GetMeritLevelDescription( ComplexBarItem.GetIndex )]"
 MERIT_PROGRESSBAR_MARKER_TOOLTIP: "[SelectLocalization(And(EqualTo_CFixedPoint(Character.MakeScope.ScriptValue('tca_merit_exam_scale_value'), '(CFixedPoint)0'), GreaterThan_int32(ComplexBarItem.GetIndex, '(int32)7')), 'tca_merit_central_marker_tooltip', 'tca_merit_native_marker_tooltip')]"
 tca_merit_native_overflow_tt: "#weak 品级达到上限时获得的贤能会在通过科举考试后计入更高等级的进度。#!"
 MERIT_CAP_OVERFLOW_WILL_COUNT: "[SelectLocalization(EqualTo_CFixedPoint(Character.MakeScope.ScriptValue('tca_merit_exam_scale_value'), '(CFixedPoint)0'), 'tca_merit_overflow_tt', 'tca_merit_native_overflow_tt')]"
 tca_merit_native_exam_would_take: "\n\n[Character.GetShortUINamePossessive|U]的[merit_level|E]上限因未通过该[examination|E]而受到限制。[SelectLocalization(Character.IsLocalPlayer, 'EXAMINATION_WOULD_TAKE_ME', 'EXAMINATION_WOULD_TAKE_OTHER')]"
 EXAMINATION_WOULD_TAKE: "[SelectLocalization(EqualTo_CFixedPoint(Character.MakeScope.ScriptValue('tca_merit_exam_scale_value'), '(CFixedPoint)0'), 'tca_merit_exam_would_take', 'tca_merit_native_exam_would_take')]"
 MERIT_TOOLTIP_EXAMINATION_PASSED_PROVINCIAL_EXAM: "@provincial_exam_icon!#T 乡试#!\n[SelectLocalization( HasPassedProvincialExamination(Character), 'EXAMINATION_PASSED', SelectLocalization(HasFailedProvincialExamination(Character),'EXAMINATION_FAILED','EXAMINATION_NOT_TAKEN') )]\n\n#S 通过后：#!\n[GetModifier( 'tgp_passed_provincial_exam_modifier' ).GetDescWithBulletPointEffects]\n\n由政府官员通过[GetActivityType('activity_local_examination').GetName][activity|E]举行\n\n$tca_merit_exam_qualification_note$"
 MERIT_TOOLTIP_EXAMINATION_PASSED_METROPOLITAN_EXAM: "@metropolitan_exam_icon!#T 会试#!\n[SelectLocalization( HasPassedMetropolitanExamination(Character), 'EXAMINATION_PASSED', SelectLocalization(HasFailedMetropolitanExamination(Character),'EXAMINATION_FAILED','EXAMINATION_NOT_TAKEN') )]\n\n#S 通过后：#!\n[GetModifier( 'tgp_passed_metropolitan_exam_modifier' ).GetDescWithBulletPointEffects]\n\n由[GetGovernment('celestial_government').GetName|E][government|E]通过[GetActivityType('activity_imperial_examination').GetName][activity|E]举行\n\n$tca_merit_exam_qualification_note$"
 MERIT_TOOLTIP_EXAMINATION_PASSED_PALACE_EXAM: "@palace_exam_icon!#T 殿试#!\n[SelectLocalization( HasPassedPalaceExamination(Character), 'EXAMINATION_PASSED', 'EXAMINATION_NOT_TAKEN' )]\n\n#S 通过后：#!\n[GetModifier( 'tgp_passed_palace_exam_modifier' ).GetDescWithBulletPointEffects]\n\n由[son_of_heaven|E]在[GetActivityType('activity_imperial_examination').GetName][activity|E]期间举行\n\n$tca_merit_exam_qualification_note$"
 celestial_government_merit_level_0_description: "\n\n可通过[imperial_examinations|E]入仕。通过考试提高资格，不直接授予所允许的最高官品。"
 celestial_government_merit_level_1_description: "\n\n九品沿考试等入仕途径取得。此后普通升品须满足[tca_merit_qualification_cap|E]与功绩要求，并经[tca_merit_annual_review|E]获选。"
 celestial_government_merit_level_2_description: "\n\n此品及后续普通升品须满足相应[tca_merit_qualification_cap|E]与功绩要求，并经[tca_merit_annual_review|E]获选。取得资格不等于已获官品。"
 celestial_government_merit_level_3_description: "\n\n此品及后续普通升品须满足相应[tca_merit_qualification_cap|E]与功绩要求，并经[tca_merit_annual_review|E]获选。取得资格不等于已获官品。"
 celestial_government_merit_level_4_description: "\n\n此品及后续普通升品须满足相应[tca_merit_qualification_cap|E]与功绩要求，并经[tca_merit_annual_review|E]获选。取得资格不等于已获官品。"
 celestial_government_merit_level_5_description: "\n\n此品及后续普通升品须满足相应[tca_merit_qualification_cap|E]与功绩要求，并经[tca_merit_annual_review|E]获选。取得资格不等于已获官品。"
 celestial_government_merit_level_6_description: "\n\n此品及后续普通升品须满足相应[tca_merit_qualification_cap|E]与功绩要求，并经[tca_merit_annual_review|E]获选。取得资格不等于已获官品。"
 celestial_government_merit_level_7_description: "\n\n三品为[tca_merit_annual_review|E]终点。出任六部中央职位可授二品；出任宰相、御史或大元帅可直接授一品，详见[tca_merit_central_grant|E]。"
 celestial_government_merit_level_8_description: "\n\n二品通过[tca_merit_central_grant|E]取得，不要求殿试资格。出任宰相、御史或大元帅可授一品；积满功绩不会自动升品。"
 celestial_government_merit_level_9_description: "\n\n一品为最高官品，通过[tca_merit_central_grant|E]取得，不要求殿试资格；离任后仍保留。"
