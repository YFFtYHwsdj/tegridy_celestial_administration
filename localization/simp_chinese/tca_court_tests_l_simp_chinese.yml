l_simp_chinese:
 tca_run_tests_decision: "调试：模组一键测试"
 tca_run_tests_decision_desc: "运行本模组全部已登记的游戏内脚本测试。各组会检查自己的测试环境，不满足条件的用例计为未通过。\n\n测试可能修改法律、角色及机构状态。请使用专用测试局，结束后不要保存为正常游玩进度。"
 tca_run_tests_decision_tooltip: "运行全部模组测试并显示上方通知"
 tca_run_tests_decision_confirm: "运行全部测试"
 tca_run_tests_effect_tt: "运行全部模组测试，上方通知显示通过、未通过数量及是否全部通过。详细记录写入debug.log。"
 tca_tests_all_passed_title: "模组测试：全部通过"
 tca_tests_not_all_passed_title: "模组测试：未全部通过"
 tca_tests_passed_desc: "通过：[tca_test_reporter.MakeScope.Var('tca_test_suite_passed').GetValue|0]　未通过：[tca_test_reporter.MakeScope.Var('tca_test_suite_not_passed').GetValue|0]。"
 tca_tests_failed_desc: "通过：[tca_test_reporter.MakeScope.Var('tca_test_suite_passed').GetValue|0]　未通过：[tca_test_reporter.MakeScope.Var('tca_test_suite_not_passed').GetValue|0]（失败：[tca_test_reporter.MakeScope.Var('tca_test_suite_failed').GetValue|0]，未执行：[tca_test_reporter.MakeScope.Var('tca_test_suite_skipped').GetValue|0]）。详情见debug.log中的TCA_TEST。"
 tca_tests_waiting_title: "模组测试：等待中"
 tca_tests_waiting_desc: "即时测试已完成。请取消暂停并推进日期，延迟测试全部完成后会显示最终结果。"
