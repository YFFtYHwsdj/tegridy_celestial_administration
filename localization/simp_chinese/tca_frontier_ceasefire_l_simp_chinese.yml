l_simp_chinese:
 tca_frontier_ceasefire.opening:0 "致[ROOT.Char.GetTitledFirstName]："
 tca_frontier_ceasefire.1.desc:0 "臣已起兵，进攻[scope:tca_fw_record.Var('tca_fw_defender').Char.GetTitledFirstName]。边地军情既有变化，谨将此事奏报。"
 tca_frontier_ceasefire.1.a:0 "让他继续进取。"
 tca_frontier_ceasefire.1.b:0 "传令，立即罢兵。"
 tca_frontier_ceasefire.2.desc:0 "你已向[scope:tca_fw_record.Var('tca_fw_defender').Char.GetTitledFirstName]兴兵。朝廷另有筹划，此战应当就此罢止，望你遵命收兵。"
 tca_frontier_ceasefire.obey:0 "臣奉诏罢兵。"
 tca_frontier_ceasefire.2.b:0 "愿请朝廷补偿出兵之费。"
 tca_frontier_ceasefire.refuse:0 "恕难奉诏，臣仍要继续此战。"
 tca_frontier_ceasefire.3.desc:0 "臣愿收兵，但出兵已有耗费。若朝廷从[treasury|E]拨付[scope:tca_fw_record.Var('tca_fw_compensation').GetValue|0]经费，臣即奉诏罢兵。"
 tca_frontier_ceasefire.3.a:0 "拨款补偿，令其收兵。"
 tca_frontier_ceasefire.3.b:0 "不予补偿，仍须奉诏。"
 tca_frontier_ceasefire.4.desc:0 "你所请的补偿不予拨付。罢兵之命不改，仍望你收兵息战。"
 tca_frontier_ceasefire.5.desc:0 "罢兵之诏，臣已收到。然而此战尚未了结，臣不能在此时收兵，唯请朝廷见谅。"
 tca_frontier_ceasefire.5.a:0 "姑且宽宥。"
 tca_frontier_ceasefire.5.b:0 "申斥，令其知过。"
 tca_frontier_ceasefire.5.c:0 "扣功绩，并处罚金。"
 tca_frontier_ceasefire.5.d:0 "罢免其地方实职，并处罚金。"
 tca_frontier_ceasefire.5.a.tt:0 "不予处分。"
 tca_frontier_ceasefire.5.b.tt:0 "扣除[scope:tca_fw_record.Var('tca_fw_officer').Char.GetShortUIName]100功绩，保留其职务。"
 tca_frontier_ceasefire.5.c.tt:0 "扣除[scope:tca_fw_record.Var('tca_fw_officer').Char.GetShortUIName]300功绩，并罚没相当于其三个月个人收入的金币。"
 tca_frontier_ceasefire.5.d.tt:0 "扣除[scope:tca_fw_record.Var('tca_fw_officer').Char.GetShortUIName]600功绩、罚没相当于其六个月个人收入的金币，并罢免其全部实土头衔（保留家门与庄园）。"
 tca_frontier_ceasefire.white_peace.tt:0 "以白和平结束这场战争。"
 tca_frontier_ceasefire.compensate.tt:0 "从国库支付所请补偿，并以白和平结束这场战争。"
 tca_frontier_ceasefire.refuse.tt:0 "继续作战；朝廷可立即问责。"
 tca_frontier_ceasefire.notice.opening:0 "致[ROOT.Char.GetTitledFirstName]："
 tca_frontier_ceasefire.6.stopped:0 "臣已奉诏收兵，与对方白和平罢战。"
 tca_frontier_ceasefire.6.pardoned:0 "此次拒不奉诏，姑且不予追究。往后行事，仍当顾及朝廷之命。"
 tca_frontier_ceasefire.6.reprimanded:0 "你拒不奉诏，现予申斥，扣除100功绩。"
 tca_frontier_ceasefire.6.fined:0 "你拒不奉诏，现扣除300功绩，并处罚金[SCOPE.GetValue('tca_fw_notice_fine')|1]金币。"
 tca_frontier_ceasefire.6.dismissed:0 "你拒不奉诏，现罢免地方实职，扣除600功绩，并处罚金[SCOPE.GetValue('tca_fw_notice_fine')|1]金币。"
 tca_frontier_ceasefire.6.a:0 "知晓。"
 tca_frontier_ceasefire.6.penalized:0 "你拒不奉诏，现扣除300功绩。"
 tca_frontier_ceasefire.6.dismissed_no_fine:0 "你拒不奉诏，现罢免地方实职，扣除600功绩。"
