l_simp_chinese:
 # 军事宫廷职位（差遣）
 tca_military_supervisor_court_position: "兵马监押"
 tca_military_supervisor_court_position_desc: "$tca_military_supervisor_court_position$置于州、军等基层官署，职司检阅营伍、巡察寨堡、弹压盗乱与巡防城防。此职为待阙武臣历练军资、修葺营寨之要任。"

 tca_military_inspector_court_position: "兵马都监"
 tca_military_inspector_court_position_desc: "$tca_military_inspector_court_position$辅佐地方长官，职司操练军伍、整饬兵甲、修治城防与筹备军需，使辖区营伍常备有序。"

 tca_corps_inspector_court_position: "都虞候"
 tca_corps_inspector_court_position_desc: "$tca_corps_inspector_court_position$职掌大军部勒行伍、督励将校、严明法令与整肃军纪。此职上秉帅臣之节制，下统步骑诸军锋刃，军法威严，行止有序。"

 # 职位资格要求
 tca_cannot_hold_multiple_military_court_positions: "未担任其他军事差遣职位"
 tca_must_be_in_official_rank: "必须在籍入品（从九品及以上）"
 tca_must_be_unlanded_official: "必须为本署待阙廷臣（非有地领主或外署封臣）"
 tca_must_have_basic_martial: "通晓兵略（军事能力不低于6）"
 tca_cannot_appoint_military_court_position_manually: "朝廷专命差遣：仅限朝廷铨选除授，不可私相除拜"

 # 称职度特质描述
 tca_court_position_commander_trait: "拥有实战指挥官特质"

 # 军事宫廷职位任务
 tca_military_supervisor_drill_levies: "督练兵伍"
 tca_military_supervisor_drill_levies_desc: "督促整饬乡兵土勇，勤修操练，以固基层民防与兵员补集之基。"

 tca_military_supervisor_order_barracks: "整饬营伍"
 tca_military_supervisor_order_barracks_desc: "检肃寨营粮饷开销，厘定常例，杜绝虚耗，整饬军纪。"

 tca_military_supervisor_inspect_defenses: "巡察城防"
 tca_military_supervisor_inspect_defenses_desc: "巡察要塞关隘与城垣壁垒，严加防御，依托险要弹压四境。"

 tca_military_inspector_drill_troops: "操练军伍"
 tca_military_inspector_drill_troops_desc: "大举部勒军马，精习阵列击刺，砥砺士气，以求两阵对垒斩获制胜。"

 tca_military_inspector_maintain_gear: "整备兵甲"
 tca_military_inspector_maintain_gear_desc: "缮治甲胄戎器，巡查武库，减损耗费，确保军士战力完备精良。"

 tca_military_inspector_inspect_troops: "检阅兵伍"
 tca_military_inspector_inspect_troops_desc: "点验册籍，核实兵额，稽查疲弱，使兵籍真实、补员迅捷。"

 tca_corps_inspector_encourage_officers: "督励将校"
 tca_corps_inspector_encourage_officers_desc: "激厉诸军将领锐气，赏罚严明，以励骑士锋刃，陷阵先登。"

 tca_corps_inspector_enforce_discipline: "申明军令"
 tca_corps_inspector_enforce_discipline_desc: "行军法严令，明正典刑，使步骑诸营进退如一，战线坚实不可撼动。"

 tca_corps_inspector_marshal_ranks: "部勒行伍"
 tca_corps_inspector_marshal_ranks_desc: "整饬行军队列，明察道途先驱，兵贵神速，加快行军转进之势。"

  # 朝廷除授通知
  tca_military_appointment_message_title: "朝廷铨选除授差遣"
  tca_military_appointment_message_desc: "枢密院与吏部已完成选期除授，敕命[tca_chosen_officer.GetShortUIName]出任本署差遣，部勒营伍，以备战阵征行。"
  tca_military_promotion_departure_message_title: "朝廷调擢差遣"
  tca_military_promotion_departure_message_desc: "朝廷考核军功政绩，以[tca_chosen_officer.GetShortUIName]历俸已满、材略过人，奉明旨拔擢移易，赴[target_liege.GetShortUIName]处就任新差遣。"
  tca_military_appointment_cooldown_tt: "履职磨勘中：任满两年方可调擢"
