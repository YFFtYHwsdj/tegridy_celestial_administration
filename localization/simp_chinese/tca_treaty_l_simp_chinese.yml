l_simp_chinese:
 tca_treaty.opening:0 "致[ROOT.Char.GetTitledFirstName]："
 tca_treaty.ack:0 "知晓。"
 tca_treaty.1.cancel:0 "两国之间的和约，今日已可重新商议。我愿与你和平解除旧约，此后双方不再承担旧约义务。"
 tca_treaty.1.waive:0 "旧约仍将履行，唯已到期的岁币尚请另作处置。我提议免除这笔欠款，往后的岁币仍依现行条款缴付。"
 tca_treaty.1.free:0 "我愿与你缔结长期和约，两国不相侵攻，各自约束臣属，亦保留援助盟友抵御进攻的权利。此约不附岁币；往后修改或和平解约，均须双方同意。"
 tca_treaty.1.offer:0 "我愿与你议定长期和约，两国不相侵攻，各自约束臣属。我方每年支付[scope:tca_treaty_proposal.Var('tca_treaty_amount').GetValue|0]岁币，首笔于新约成立满一年缴付；若是修改旧约，原付款日期不变。"
 tca_treaty.1.ask:0 "我愿与你议定长期和约，两国不相侵攻，各自约束臣属。你方每年支付[scope:tca_treaty_proposal.Var('tca_treaty_amount').GetValue|0]岁币，首笔于新约成立满一年缴付；若是修改旧约，原付款日期不变。"
 tca_treaty.1.accept:0 "接受这份提议。"
 tca_treaty.1.reject:0 "我不能接受。"
 tca_treaty.2.yes:0 "你提出的和约条款，我已同意，双方依此履行。"
 tca_treaty.2.no:0 "你提出的和约条款，我不能接受。已有约定仍依原条款履行。"
 tca_treaty.3.desc:0 "本期岁币尚未缴清。请在九十日宽限内补足；逾期仍欠，便视为你方违约，旧约随之解除。"
 tca_treaty.3.pay:0 "立即补缴。"
 tca_treaty.3.grace:0 "我会在宽限内筹款。"
 tca_treaty.3.refuse:0 "不再支付。"
 tca_treaty.3.break_tt:0 "解除和约，并承担撕毁停战的威望与威望等级损失。"
 tca_treaty.4.desc:0 "和约已因你我一方违约而解除。双方不再承担旧约义务，未付岁币一并取消。"
