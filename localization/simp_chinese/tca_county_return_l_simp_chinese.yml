l_simp_chinese:
 tca_return_excess_county_decision: "交还兼领州县"
 tca_return_excess_county_decision_desc: "一州一县的赋役、词讼与日常公事，本就够一任守臣朝夕操持。眼下我一人兼领数处，几方衙门的文书账册一并堆上案头，终究分身乏术，难免顾此失彼。与其勉力遥领，不如交还其中一处，由新任官员接掌，自己专守本任，将治所诸事料理妥当。"
 tca_return_excess_county_decision_tooltip: "交还一处兼领州县，由新任官员接管"
 tca_return_excess_county_decision_confirm: "交还"
 tca_county_return_over_limit_tt: "直辖领地超过当前上限"
 tca_county_return_no_pending_tt: "当前没有未结的州县交还、行政整饬或请祠致仕之事"
 tca_county_return_effect_tt: "交割所选州县的印信图籍，由新任官员接掌。"
 tca_county_return_pending_title: "州县交割"
 tca_county_return_pending_desc: "交还[tca_vcr_notice_title.GetName]，衙中正检点印信与图籍，办理交割。"
 tca_county_return_done_title: "州县交割已毕"
 tca_county_return_done_desc: "[tca_vcr_transfer_successor.GetShortUIName]已接掌[tca_vcr_transfer_title.GetName]，印信图籍交割完毕，此后你可专心本任。"
 tca_county_return_failed_title: "交还州县作罢"
 tca_county_return_failed_desc: "此次州县交割未能完成，尚未交出的州县仍由原任掌管。"
 tca_county_return_partial_title: "州县已交，统属未定"
 tca_county_return_partial_desc: "[tca_vcr_transfer_title.GetName]已交由[tca_vcr_transfer_successor.GetShortUIName]接掌，其上下统属尚有未理顺之处。"
 tca_county_return_failed_office_desc: "你的官职与处境已有变动，此次州县交割作罢。"
 tca_county_return_failed_realm_desc: "所属君上已换，此次州县交割作罢。"
 tca_county_return_failed_limit_desc: "你名下直辖州县已合乎朝廷定额，无须再行辞交。"
 tca_county_return_failed_target_desc: "拟交还的州县已易他人，或已为你本任及治所所在，不可再作兼领交割。"
 tca_county_return_failed_conflict_desc: "你另有任免整饬或请祠致仕之事在身，交还兼领州县一节暂且作罢。"
 tca_county_return_failed_timeout_desc: "印信图籍迟迟未能交割，此事暂告中止。"
 tca_county_return_in_progress_desc: "衙中正在检点[GetPlayer.MakeScope.Var('tca_county_return_title').Title.GetName]的印信与图籍，交予新任官员。"
 tca_return_excess_county_decision_no_item_selected: "请选择交还的州县"
