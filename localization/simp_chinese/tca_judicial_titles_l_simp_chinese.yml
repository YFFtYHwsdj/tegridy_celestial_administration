l_simp_chinese:
 tca_judicial_title_name: "[tca_circuit.GetNameNoTierNoTooltip]提点刑狱司"
 tca_judicial_title_adj: "提刑司"
 tca_judicial_holder: "提点刑狱公事"
 tca_celestial_duke_holder_male: "[CHARACTER.Custom('TCAJudicialHolderTitle')]"
 tca_celestial_duke_holder_female: "[CHARACTER.Custom('TCAJudicialHolderTitle')]"
 tca_view_judicial_titles_decision: "查看提刑头衔"
 tca_view_judicial_titles_decision_desc: "只读查看本辖区提刑头衔：实际继承法、继承结果类型与完整顺位、持有者政府和主头衔、直属关系、任职资格及 IsDestroyedOnSuccession。若继承人是所属路领主，会另行提示。"
 tca_view_judicial_titles_decision_tooltip: "显示本辖区的提刑头衔"
 tca_view_judicial_titles_decision_confirm: "查看"
 tca_judicial_title_view_message: "[tca_viewed_title.GetNameNoTooltip]"
 tca_judicial_title_view_message_desc: "所属路：[tca_viewed_circuit.GetName]。点击头衔纹章查看详情。空缺职位不会在封臣人物列表中显示。"
 tca_test_judicial_appointment_decision: "测试提刑维护与补位"
 tca_test_judicial_appointment_decision_desc: "维护本辖区提刑：沿用原版天朝文官领地继承法并清除旧版提刑专属法，恢复名称、纹章与销毁标记，修复直属关系。保留合格在任者；对空缺、有实际领地或兼持其他非家族官职者重新补位。补位按功绩门槛和学识权重筛选非历史无地角色，无人合格时生成文官学者。只转移提刑官职，原持有者保留其领地和家族头衔。维护后显示诊断；读取维护前状态请先执行“查看提刑头衔”。"
 tca_test_judicial_appointment_decision_tooltip: "清除旧版专属法、沿用原版文官继承、修复显示和归属、补齐空缺或异常任职"
 tca_test_judicial_appointment_decision_confirm: "执行测试"
 tca_judicial_status_held: "所属路：[tca_viewed_circuit.GetName]。政府：[tca_viewed_holder.GetGovernment.GetName]。在任者：[tca_viewed_holder.GetName]。直属领主：[tca_viewed_actual_liege.GetName]，与所属路持有者一致。请检查其政府、头衔称号与继任名单。"
 tca_judicial_status_held_title: "[tca_viewed_title.GetNameNoTooltip]：在任"
 tca_judicial_status_wrong_liege_title: "[tca_viewed_title.GetNameNoTooltip]：直属归属异常"
 tca_judicial_status_wrong_liege: "所属路：[tca_viewed_circuit.GetName]。在任者：[tca_viewed_holder.GetName]。实际直属领主：[tca_viewed_actual_liege.GetName]；应直属：[tca_viewed_circuit.GetHolder.GetName]。归属修复尚未达到预期，请检查日志。"
 tca_judicial_status_independent: "所属路：[tca_viewed_circuit.GetName]。在任者：[tca_viewed_holder.GetName]没有直属领主；应直属：[tca_viewed_circuit.GetHolder.GetName]。归属修复尚未达到预期，请检查日志。"
 tca_judicial_succession_message_title: "[tca_viewed_title.GetNameNoTooltip]：继承诊断"
 tca_judicial_succession_not_appointment: "该官职的实际继承顺序不是任命继承。执行维护以设置持有者的原版天朝文官领地法并清理旧版提刑专属法；若仍异常，检查其他残留头衔法律。"
 tca_judicial_succession_has_heir: "头衔当前继承人：[tca_viewed_office_heir.GetName]。继承人主头衔：[tca_viewed_office_heir.GetPrimaryTitle.GetName]。\n原版冷却日期：[tca_viewed_office_heir.GetNewAppointmentCooldownDate.GetString]；原因：[tca_viewed_office_heir.GetAppointmentTimeoutText]。提刑直接使用原版文官任命，启用近期任命冷却；同级调任还须满足重要性等限制。\n存在继承人不等于存在普通任命候选人，请结合继承结果类型判断是否兜底。"
 tca_judicial_succession_no_heir: "官职的 current_heir 为空。正常任命候选人尚未产生。原版继承法不能保证永远有人符合功绩、性别、契约等条件；死亡后的空缺或不合格持有者将由补位流程处理。"
 tca_judicial_status_vacant_title: "[tca_viewed_title.GetNameNoTooltip]：空缺"
 tca_judicial_status_vacant: "所属路：[tca_viewed_circuit.GetName]。头衔无持有者；执行“测试提刑维护与补位”补任，沿用原版文官继承法并清除旧版提刑专属法。"
 tca_judicial_destroyed_on_succession_title: "[tca_viewed_title.GetNameNoTooltip]：当前继承销毁判定"
 tca_judicial_destroyed_on_succession_desc: "所属路：[tca_viewed_circuit.GetName]。头衔对象有效： [Select_CString( tca_viewed_title.IsValid, 'true', 'false' )]。IsDestroyedOnSuccession = [Select_CString( tca_viewed_title.IsDestroyedOnSuccession, 'true', 'false' )]。这是原版头衔窗口使用的引擎判定；true 对应显示‘无继承’，false 进入正常继承区块。此通知只读取，不修改头衔。任命测试中的‘当前’通知读取维护后的值。若值留白或表达式未解析，请检查 error.log，本次不能视为成功读取。"
 tca_judicial_succession_law_title: "[tca_viewed_title.GetNameNoTooltip]：当前继承法"
 tca_judicial_succession_law_desc: "头衔实际继承法：\n[tca_viewed_title.GetSuccessionDescription]\n\n继承结果类型：[tca_viewed_title.GetSuccessionResultTypeName]\n[tca_viewed_title.GetSuccessionResultTypeDesc]\n完整继承顺位：\n[tca_viewed_title.GetLineOfSuccessionDesc]\n\n持有者领地法：[tca_viewed_holder.GetActiveLawInGroupWithFlag('succession_order_laws').GetName]。性别法：[tca_viewed_holder.GetActiveLawInGroupWithFlag('succession_gender_laws').GetName]。\n头衔有专属法：[Select_CString( tca_viewed_title.HasLaws, 'true', 'false' )]。当前方案沿用持有者的原版文官领地法；旧版提刑专属法由维护移除。家族头衔保留原版独立继承法。"
 tca_judicial_appointment_succession_law: "提刑专任继承制"
 tca_judicial_appointment_succession_law_effects: "官职直接使用原版天朝文官功绩任命类型，允许同级升迁并启用原版近期任命冷却；同级新职必须更重要。正常走任命继承，补位仅处理空缺或交接后异常。家族头衔保留原版继承。"
 tca_judicial_succession_liege_heir: "警告：头衔当前继承人是所属路领主 [tca_viewed_office_heir.GetName]。请结合继承结果类型判断是否 fallback_default。死亡后若领主取得官职，延迟维护将另选专职官员。"
 tca_judicial_eligibility_title: "[tca_viewed_title.GetNameNoTooltip]：任职资格"
 tca_judicial_holder_eligible: "当前任职资格：合格。持有者 [tca_viewed_holder.GetName] 为无地天朝公爵，以本提刑为主头衔，其他持有头衔仅为家族头衔。归属另见直属关系通知。"
 tca_judicial_holder_ineligible: "当前任职资格：不合格。持有者：[tca_viewed_holder.GetName]；主头衔：[tca_viewed_holder.GetPrimaryTitle.GetName]。要求无地、天朝政府、公爵级，以该提刑为主头衔且没有其他非家族头衔。延迟交接维护、季度维护或测试决议将重新补位。"
