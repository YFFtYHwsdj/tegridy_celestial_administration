 tca_rectify_subordination_actor_eligible_tt: "发起者须为在任[son_of_heaven|E]或[grand_secretariat_director|E]"
 tca_rectify_subordination_recipient_eligible_tt: "[recipient.GetShortUIName]须为本国天朝制下的地方实职守臣（公国级或伯爵级）"
 tca_rectify_subordination_de_jure_liege_exists_tt: "[recipient.GetPrimaryTitle.GetName]的法理上级官署须已有官员在任"
 tca_rectify_subordination_liege_mismatch_tt: "[recipient.GetShortUIName]当前的直属上级（[recipient.GetLiege.GetTitledFirstName]）与其法理上级持有人（[recipient.GetPrimaryTitle.GetDeJureLiege.GetHolder.GetTitledFirstName]）不同"
