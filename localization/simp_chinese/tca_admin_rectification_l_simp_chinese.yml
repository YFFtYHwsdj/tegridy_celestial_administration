 tca_request_retract_concurrent_title_interaction_desc: "具疏奏请[intermediary.GetTitledFirstName]准许，收回[recipient.GetShortUIName]不当兼领的地方官署或越辖直辖州郡，并按本朝铨选之制另任合格官员接掌。"
 tca_request_retract_concurrent_title_interaction_send: "具疏奏请裁撤"
 tca_retract_concurrent_title_prompt: "指定要裁撤并另行铨选官员接任的兼领官署或越辖州郡"
