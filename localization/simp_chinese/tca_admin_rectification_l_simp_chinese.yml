 tca_retract_concurrent_title_is_secular_local_tt: "[target.GetName]须为王国级、公国级地方官署或伯爵级直辖州郡（不含家族、提刑、通判、奉祠或致仕头衔）"
 tca_retract_concurrent_not_primary_title_tt: "[target.GetName]是[recipient.GetShortUIName]的[primary_title|E]，不在裁撤兼领之列"
 tca_retract_concurrent_not_capital_duchy_tt: "[target.GetName]是[recipient.GetShortUIName]领地首府（[recipient.GetCapitalLocation.GetTitle.GetDeJureLiege.GetNameNoTier]）所在的法理公国，依制准许兼领"
 tca_retract_concurrent_county_outside_primary_de_jure_tt: "[target.GetName]位于[recipient.GetShortUIName]主头衔（[recipient.GetPrimaryTitle.GetName]）的法理管辖范围内，不属于越辖州郡"
 tca_retract_concurrent_county_not_sole_capital_tt: "[target.GetName]是[recipient.GetShortUIName]的领地首府伯爵领，且其在[recipient.GetPrimaryTitle.GetName]法理范围内尚无其他亲自直辖的伯爵领，依制享有首府豁免"
 tca_retract_concurrent_county_count_tier_capital_tt: "[recipient.GetShortUIName]为伯爵级主官，其领地首府（[recipient.GetCapitalLocation.GetTitle.GetDeJureLiege.GetName]）不在裁撤兼领之列"
 tca_retract_concurrent_kingdom_requires_approval_tt: "当前[scales_of_power|E]尚未偏向[grand_secretariat_director|E]（低于#V 60#!），裁撤[kingdom|E]级兼领官署须经[son_of_heaven|E]批准"
 tca_retract_concurrent_kingdom_direct_allowed_tt: "当前[scales_of_power|E]已偏向[grand_secretariat_director|E]（达到#V 60#!），无需奏请批准即可径行裁撤"

 # 裁撤兼领：效果预览提示
 tca_retract_concurrent_title_effect_tt: "向[recipient.GetShortUIName]下达行政整饬文书：收回[target.GetName]，依本朝资序与铨选规则直接移交合格继任官员，并理顺相关封属关系；不产生[tyranny|E]或[claims|E]"
 tca_request_retract_concurrent_title_effect_tt: "获[intermediary.GetTitledFirstName]准奏后，向[recipient.GetShortUIName]下达行政整饬文书：收回[target.GetName]，依本朝资序与铨选规则直接移交合格继任官员，并理顺相关封属关系；不产生[tyranny|E]或[claims|E]"

 ##################################################
 # 天子审批明细与反馈通知
 ##################################################
 tca_admin_rectification_approval_yes: "#T [intermediary.GetTitleAsNameNoTooltip]将准奏#!"
 tca_admin_rectification_approval_no: "#T [intermediary.GetTitleAsNameNoTooltip]将驳回所奏#!"
 tca_admin_rectification_approval_maybe: "#T [intermediary.GetTitleAsNameNoTooltip]可能准奏：$VALUE|0/%$#!"
 tca_admin_rectification_approval_institutional_reason: "整饬兼领合乎朝廷定制：$VALUE|=+0$"
 tca_admin_rectification_approval_actor_opinion: "[intermediary.GetShortUIName]对[actor.GetShortUIName]的好感：$VALUE|=+0$"
 tca_admin_rectification_approval_target_opinion: "[intermediary.GetShortUIName]对[recipient.GetShortUIName]的好感：$VALUE|=+0$"
 tca_admin_rectification_approval_scales_reason: "当前[scales_of_power|E]态势：$VALUE|=+0$"
 tca_admin_rectification_cannot_refuse_reason: "行政整饬属中枢法度，地方守臣无权抗命：$VALUE|=+0$"

 tca_admin_rectification_approved_toast: "行政整饬奏请获准"
 tca_admin_rectification_approved_message: "[intermediary.GetTitledFirstName]准许了你的奏请，已向[recipient.GetShortUIName]下达裁撤[target.GetName]兼领之命。"
 tca_admin_rectification_vetoed_toast: "行政整饬奏请被驳回"
 tca_admin_rectification_vetoed_message: "[intermediary.GetTitledFirstName]驳回了你裁撤[recipient.GetShortUIName]所兼[target.GetName]的奏请。"
 tca_admin_rectification_invalidated_toast: "行政整饬已失效"
 tca_admin_rectification_invalidated_message: "因相关头衔或辖属关系已生变动，针对[recipient.GetShortUIName]的行政整饬不再执行。"

 ##################################################
 # 书信事件：归正辖属（tca_admin_rectification.10）
 ##################################################
 tca_admin_rectification.10.t: "归正辖属之命"
 tca_admin_rectification.10.desc.emperor: "朕惟设官分职，各有统纪；上下相维，方成治体。尔见领[recipient.GetPrimaryTitle.GetName]，按朝廷疆理之制，本当归属[scope:tca_rectify_new_liege_title.GetName]节制，然此前却直隶于[scope:tca_rectify_old_liege.GetTitledFirstName]之下，统属未合定章。今特降诏整饬，命尔自奉诏之日起，改隶[scope:tca_rectify_new_liege.GetTitledFirstName]统摄。尔所领本职与治所一切照旧，务须恪守官常，毋违成宪。"
 tca_admin_rectification.10.desc.diarch: "中书门下勘会：朝廷定制，路府州郡各有统属，上下节级不容紊乱。尔见领[recipient.GetPrimaryTitle.GetName]，依疆理本属[scope:tca_rectify_new_liege_title.GetName]管内，此前却隶于[scope:tca_rectify_old_liege.GetTitledFirstName]之下，于制未合。今由政事堂依制整饬，命尔即日起改隶[scope:tca_rectify_new_liege.GetTitledFirstName]统摄。尔本职差遣与治所俱仍其旧，宜谨守法度，依章奉行。"
 tca_admin_rectification.10.a: "谨遵朝命。"
 tca_admin_rectification.10.a.tt: "你的直属上级由[scope:tca_rectify_old_liege.GetTitledFirstName]变更为[scope:tca_rectify_new_liege.GetTitledFirstName]（[scope:tca_rectify_new_liege_title.GetName]），所领头衔与治所保持不变。"
 tca_admin_rectification.10.invalid: "时移事易，此命无须再行。"
 tca_admin_rectification.10.invalid.tt: "相关头衔或辖属关系已生变动，本次归正辖属不再执行。"

 ##################################################
 # 书信事件：裁撤兼领（tca_admin_rectification.20）
 ##################################################
 tca_admin_rectification.20.t: "裁撤兼领之命"

 # 开篇：区分天子亲诏、宰辅奏准奉敕、宰辅依制径行
 tca_admin_rectification.20.opening.emperor: "朕惟地方守臣，贵在专任责成；若兼领过多或越境遥辖，则政令难免旷废。尔见任[scope:tca_retract_primary_title.GetName]，又兼掌[scope:tca_retract_target_title.GetName]，按诸本朝官制，实属不当兼领。"
 tca_admin_rectification.20.opening.approved: "准[actor.GetTitledFirstName]奏：地方守臣贵在各专其任，不宜久兼数署或越境遥领。尔见任[scope:tca_retract_primary_title.GetName]，兼掌[scope:tca_retract_target_title.GetName]，经中枢核议，于本朝疆理与兼领定制不合，业已奉旨准予裁撤。"
 tca_admin_rectification.20.opening.diarch: "中书门下勘会：地方设官，重在疆界分明、责有所归。尔见任[scope:tca_retract_primary_title.GetName]，又兼掌[scope:tca_retract_target_title.GetName]，按诸本朝疆理与兼领之制，不在准许兼任之列，今由政事堂依制予以裁撤。"

 # 正文后段：区分路府官署兼领、越辖州郡兼领、以及卸去最后一处实职领地
 tca_admin_rectification.20.body.office: "\n\n朝廷已另简合格官员[scope:tca_retract_successor.GetTitledFirstName]接掌[scope:tca_retract_target_title.GetName]。文书到日，尔当即将该署印信、文卷及所属州县统属关系一并交割，此后专领本职，以修实政。"
 tca_admin_rectification.20.body.county: "\n\n守臣直辖州郡，须依本职封疆为限。朝廷已另委[scope:tca_retract_successor.GetTitledFirstName]接管[scope:tca_retract_target_title.GetName]。文书到日，尔当即将该州印信与钱谷图籍依制交割，此后仍留任本职，专心治内。"
 tca_admin_rectification.20.body.unlanded: "\n\n朝廷已另委[scope:tca_retract_successor.GetTitledFirstName]接掌[scope:tca_retract_target_title.GetName]。该处交割之后，尔名下已无其他实职治所，当依例解任归家，静候朝廷日后叙用。"

 tca_admin_rectification.20.a: "依制交割。"
 tca_admin_rectification.20.a.tt: "你将[scope:tca_retract_target_title.GetName]移交予新任官员[scope:tca_retract_successor.GetTitledFirstName]，其余合法头衔与品秩保持不变。"
 tca_admin_rectification.20.invalid: "时移事易，此命无须再行。"
 tca_admin_rectification.20.invalid.tt: "相关头衔或辖属关系已生变动，本次裁撤兼领不再执行。"
