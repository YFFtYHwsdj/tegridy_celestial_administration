l_simp_chinese:
 tca_treasury_reserve_law_group: "官库留储法"
 tca_treasury_reserve_law_group_desc: "朝廷定制天下官库的留储与岁首上缴。从严、常额、从宽三档按头衔等级保留绝对保底，并按近三年最高月收入保留至多二十四个月；超出留储上限的羡余，岁首缴还内库。免缴档则停收羡余，官库不再受留储上限约束。\n\n保底：伯爵 250、公爵 500、王国 1000、帝国 2000。\n$EFFECT_LIST_BULLET$前三档只缩放保底，二十四个月收入上限不变。\n$EFFECT_LIST_BULLET$上缴额不足 25 不转移、不通知。"
 tca_treasury_reserve_strict_law: "从严留储"
 tca_treasury_reserve_strict_law_desc: "严限官库留储：保底按常额的四分之三计，二十四个月收入上限不变，岁首收缴更紧。\n\n$EFFECT_LIST_BULLET$适合需要集中财权的朝廷。"
 tca_treasury_reserve_normal_law: "常额留储"
 tca_treasury_reserve_normal_law_desc: "官库留储依常额保底与二十四个月留存收入上限，岁首收缴超额羡余。\n\n$EFFECT_LIST_BULLET$开局默认制度。"
 tca_treasury_reserve_lenient_law: "从宽留储"
 tca_treasury_reserve_lenient_law_desc: "宽予地方留储：保底按常额的一倍半计，二十四个月收入上限不变，岁首收缴较轻。\n\n$EFFECT_LIST_BULLET$适合需要安抚地方、扩大自主的朝廷。"
 tca_treasury_reserve_exempt_law: "免缴羡余"
 tca_treasury_reserve_exempt_law_desc: "官府不再于岁首缴还羡余，官库留储不设上限，朝廷不回收超额国库。\n\n$EFFECT_LIST_BULLET$适合完全放权地方或暂缓财政集中的朝廷。"
 tca_treasury_reserve_reform_cooldown: "留储法改制未满十年"
 tca_treasury_reserve_emperor_briefing_title: "诸司岁计"
 tca_treasury_reserve_emperor_briefing_desc: "岁首校计天下官库，依留储之法，诸司缴还羡余共计 [TopScope.GetValue('tca_tr_total')|0]，凡 [TopScope.GetValue('tca_tr_count')|0] 司，悉入内库。"
 tca_treasury_reserve_emperor_briefing_tooltip: "岁首按官库留储法结算全国官库：保留头衔等级保底与最多二十四个月留存收入，超出部分缴入皇帝国库。"
 tca_treasury_reserve_payer_notice_title: "官库留储"
 tca_treasury_reserve_payer_notice_desc: "本司官库留储上限 [TopScope.GetValue('tca_tr_notice_cap')|0]，缴还羡余 [TopScope.GetValue('tca_tr_notice_amount')|0]，已入内库。"
 tca_treasury_reserve_payer_notice_tooltip: "岁首按官库留储法结算：保留保底与最多二十四个月留存收入，超出部分缴还皇帝国库。"
