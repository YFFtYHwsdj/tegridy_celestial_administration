l_simp_chinese:
 # 功绩升品百科；完整规则在概念中维护，浮窗只显示当前处境。
 game_concept_tca_merit_annual_review: "铨叙"
 game_concept_tca_merit_annual_review_desc: "铨叙是天朝每年正月举行的官员升品选拔。文武分别审议，同品官员在本国竞争下一品名额；普通铨叙从九品逐级升至三品。\n\n#bold 参加条件#!\n官员须已入品、成年，功绩达到下一品门槛，并有相应[tca_merit_qualification_cap|E]。致仕、辞谢及其他不符合参选条件者不参加；同一人物每年最多普通升品一次，转换文武仕途或迁往他国不会获得第二次机会。\n\n#bold 如何获选#!\n名额根据各品在籍官员人数与朝廷员额调整，达到门槛不保证升品。相同来源官品的竞争者中，功绩较高者更有机会获选；不是按功绩排名依次授予，也不是所有人机会相等。小规模朝廷可能出现没有名额的年份。\n\n#bold 结果#!\n未获升品者保留功绩，可继续积累并参加以后的铨叙。成功升品后，功绩调整为新官品的门槛数额，再由此积累。升品不会自动调任新官职。\n\n#bold 三品以后#!\n普通铨叙止于三品。二品、一品通过[tca_merit_central_grant|E]取得，不能仅靠功绩或考试继续升品。"
 game_concept_tca_merit_qualification_cap: "升品资格上限"
 game_concept_tca_merit_qualification_cap_desc: "升品资格上限表示考试等第与入仕身份允许官员通过[tca_merit_annual_review|E]竞争到的最高官品。它与已经取得的[merit_level|E]不同：取得资格只是允许参选，仍须满足功绩等条件并获选，才能实际升品。\n\n通常，未取得更高资格者可至八品，通过[provincial_examination|E]后可至六品，再通过[metropolitan_examination|E]后可至四品，最后通过[palace_examination|E]后资格可至一品。免试等入仕身份也可能提高资格，具体以人物实际资格为准。\n\n#bold 考试资格与三品终点#!\n资格表示考试与出身允许的范围；普通铨叙本身最高只授三品。即使殿试及第、功绩充足，二品和一品仍须经[tca_merit_central_grant|E]取得。\n\n通过考试只提高资格，不立即授予相应官品；失去资格也不会自动收回已经取得的官品。任职授品不受此上限限制。\n\n本概念适用于天朝；[meritocratic|E]保留依考试上限与功绩积累晋级的规则，不参加天朝铨叙。"
 game_concept_tca_merit_central_grant: "任职授品"
 game_concept_tca_merit_central_grant_desc: "任职授品是天朝依实际中央任职授予官品的途径，用于取得普通[tca_merit_annual_review|E]不能授予的二品和一品。\n\n$EFFECT_LIST_BULLET$出任六部中央职位，授二品。\n$EFFECT_LIST_BULLET$出任宰相、御史或大元帅，授一品。\n\n任职授品不要求先积满下一品功绩，也不受[tca_merit_qualification_cap|E]限制。低品乃至尚未入品者可按任职直接取得相应官品，不必逐品晋升；三品官员可因相应任职直接授一品。\n\n任职授品不占年度铨叙名额；同年普通升品后仍可因中央任职获得更高官品。已接受任职授品者，当年不再参加普通升品。\n\n已经持有相同或更高官品者不再升品，不因调任较低职位而降品；离任后也保留已取得的官品。实际升品时，功绩调整为新官品的门槛数额，再由此积累。\n\n官品与官职仍分别处理：获授高品不保证继续在职，也不会免除原有中央任命的条件与政治后果。"
