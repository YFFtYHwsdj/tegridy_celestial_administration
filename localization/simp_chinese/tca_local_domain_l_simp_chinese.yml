l_simp_chinese:
 tca_local_domain_policy_law: "州郡兼领法"
 tca_local_domain_policy_law_desc: "地方文武守臣能否兼领州郡，由朝廷定制。天子的直辖上限不受此法限制。"
 tca_local_domain_original_law: "量才兼领"
 tca_local_domain_original_law_desc: "朝廷不设死限，量才委任，让干练守臣总揽更多州郡。\n\n$EFFECT_LIST_BULLET$不额外限制地方文官与军事长官的直辖上限。"
 tca_local_domain_civil_law: "文臣专领"
 tca_local_domain_civil_law_desc: "治民文臣不宜分心他顾；但朝廷对统兵将帅格外放宽。\n\n$EFFECT_LIST_BULLET$地方文官的直辖上限为1；军事长官不受此项限制。"
 tca_local_domain_all_law: "文武专领"
 tca_local_domain_all_law_desc: "朝廷对文武守臣一视同仁，令其各守一地，不再兼领他州。\n\n$EFFECT_LIST_BULLET$地方文官与军事长官的直辖上限均为1。"
 tca_local_domain_subject_law: "州郡兼领之制"
 tca_local_domain_subject_law_desc: "地方守臣的直辖依朝廷法度而定。"
 tca_local_domain_unrestricted_law: "量才兼领"
 tca_local_domain_unrestricted_law_desc: "直辖上限依循旧制。"
 tca_local_domain_restricted_law: "州郡专领"
 tca_local_domain_restricted_law_desc: "依州郡兼领法，直辖上限为1。"
 tca_local_domain_reform_cooldown: "州郡兼领之制方有更张，须待[GetCurrentDateWithDiff(GetVarTimeRemaining(THIS.Char.MakeScope, 'tca_local_domain_reform_cooldown'))]方可再议。"
 tca_test_local_domain_capacity: "直辖容量测试基线"
 tca_test_local_domain_capacity_desc: "仅供独立测试局核对直辖容量。"
