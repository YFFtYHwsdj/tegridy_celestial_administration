l_simp_chinese:
 trait_tca_fengci:0 "奉祠"
 trait_tca_fengci_desc:0 "解去实职，领宫观祠禄；奉祠期间不受任差遣，合乎条件时仍可依例起复。"
 trait_tca_retired:0 "致仕"
 trait_tca_retired_desc:0 "既辞仕途，居家支领致仕俸禄，不再受任实职。"
 tca_fengci_decision:0 "请奉祠"
 tca_fengci_decision_desc:0 "仕途进退，不必一味求进。若能请领一处宫观祠禄，便可暂离官场诸务，得些清闲；日后若有心复出，也还留有转圜余地。"
 tca_fengci_decision_tooltip:0 "申请转为奉祠，暂不受任实职"
 tca_fengci_decision_confirm:0 "具疏请祠"
 tca_retire_decision:0 "请致仕"
 tca_retire_decision_desc:0 "仕途总有尽时。与其长留宦海，不如趁此具疏致仕，彻底放下官场牵挂，归家安度余年。"
 tca_retire_decision_tooltip:0 "申请永久致仕，不再受任或起复"
 tca_retire_decision_confirm:0 "具疏致仕"
 tca_resume_decision:0 "请起复"
 tca_resume_decision_desc:0 "奉祠虽得清闲，心下却仍牵挂仕途。如今精力尚可，不妨辞去祠职，重归铨选候任，静待朝廷叙用。"
 tca_resume_decision_tooltip:0 "申请结束奉祠，重新候任"
 tca_resume_decision_confirm:0 "请复仕途"
 tca_retirement_native_transfer_desc:0 "既已退居林下，家门与庄园诸事也不必一直由我独自操持。若将当家之责交给合法继承人掌管，我也能安心颐养。"
 tca_retirement_native_decision_effect_tt:0 "在下一事件中选择奉祠或致仕。本决议的影响力照常扣除，此入口不再提供保持原职。"
 tca_retirement_transfer_tooltip:0 "将家门传给合法继承人"
 tca_retirement.10.t:0 "进退之请"
 tca_retirement.10.desc:0 "[scope:tca_retirement_applicant.GetTitledFirstName]具疏请命。其进退与优礼，待朕裁定。"
 tca_retirement.10.honor:0 "准其致仕，加官一级。"
 tca_retirement.10.approve:0 "依现有品秩准其所请。"
 tca_retirement.10.deny:0 "所请不允，令其照旧。"
 tca_retirement.10.expired:0 "情势已变，此疏无须再议。"
 tca_retirement.12.t:0 "诏命已下"
 tca_retirement.12.approved:0 "先前的奏请已有答复，朝廷的旨意已经送达。"
 tca_retirement.12.denied:0 "先前的奏请未蒙圣允，朝廷命你一切照旧。按制，满一年后方可再次陈请。"
 tca_retirement.12.invalid:0 "时移事易，先前的奏请已不再适用，就此作罢。日后若仍有此意，须视届时条件另作计议。"
 tca_retirement.20.t:0 "家事有托"
 tca_retirement.20.desc:0 "退居闲散之后，家门与庄园仍须有人主持。是趁此将家业交给合法继承人掌管，还是暂且仍由自己料理？"
 tca_retirement.20.transfer:0 "将家事托付继承人。"
 tca_retirement.20.keep:0 "暂且由我料理。"
 tca_retirement.continue:0 "知道了。"
 tca_retirement.10.fengci:0 "[scope:tca_retirement_applicant.GetTitledFirstName]上疏请辞见任职事，乞领宫观祠禄以退处清闲。准许之后，其暂不受任实职，日后仍可依例起复。"
 tca_retirement.10.retire:0 "[scope:tca_retirement_applicant.GetTitledFirstName]上疏请解职致仕，永辞仕途。是否准其所请，又当如何裁处，待朕定夺。"
 tca_retirement.10.resume:0 "[scope:tca_retirement_applicant.GetTitledFirstName]现居祠职，今上疏请辞祠禄、重归铨选候任。若准其所请，便是许其复入候补之列，眼下无须即刻授以实职。"
 tca_retirement.10.honor_only:0 "[scope:tca_retirement_applicant.GetTitledFirstName]现已不任实职，并已依例致仕归家。按制，高品臣僚致仕，是否加官一级以示恩礼，尚待朕裁定。"
 tca_retirement.92.t:0 "品秩尚待核定"
 tca_retirement.92.desc:0 "致仕加恩尚未落定，暂不能传付家门。你现有的闲退身份与原品待遇仍予保留。"
 tca_retirement.92.retry:0 "重新核定"
 tca_retirement_rank_settled_tt:0 "品秩已经核定"
 tca_retirement_seniority_tt:0 "任有实职，或官居六品以上，或已奉祠"
 tca_retirement_fengci_age_tt:0 "已到本朝奉祠年龄（致仕年龄前十年；无固定年龄时为六十岁）"
 tca_retirement_fengci_health_tt:0 "或身有衰病、失能、失明、健康危重（可提前请祠）"
 tca_retirement_retire_age_tt:0 "已到本朝致仕年龄（无固定年龄时为七十岁）"
 tca_retirement_retire_health_tt:0 "或衰病深重、失能、失明、健康危重（可提前致仕；无固定年龄时，六十岁以上身有衰病亦可致仕）"
 tca_retirement_no_pending_request_tt:0 "尚无奏请待批"
 tca_retirement_retry_available_tt:0 "上次奏请若被驳回，已过一年"
 tca_fengci_decision_request_effect_tt:0 "上疏请祠，等候皇帝准许。获准后卸去实职，按本人官品领取祠禄；奉祠期间不受任实职，日后仍可申请起复。"
 tca_fengci_decision_effect_tt:0 "转为奉祠，按本人官品领取祠禄；奉祠期间不受任实职，日后仍可申请起复。"
 tca_retire_decision_request_effect_tt:0 "上疏致仕，等候皇帝准许。获准后永久退出仕途，按本人官品领取致仕俸，此后不再受任或起复；加恩依品秩与恩命议定。"
 tca_retire_decision_effect_tt:0 "永久退出仕途，按本人官品领取致仕俸，此后不再受任或起复；加恩依品秩与恩命议定。"
 tca_retirement_ai_evaluate_decision:0 "考虑进退"
 tca_retirement_ai_evaluate_decision_desc:0 "衡量继续任职、奉祠与致仕的取舍。"
 tca_retirement_ai_transfer_decision:0 "考虑传家"
 tca_retirement_ai_transfer_decision_desc:0 "衡量是否将家门交给继承人。"
 tca_retirement.30.t:0 "进退之际"
 tca_retirement.30.desc:0 "年岁与境遇渐有变化，仕途的下一步也该重新斟酌。"
 tca_retirement.30.keep:0 "眼下仍以维持现状为宜。"
 tca_retirement.14.t:0 "致仕之恩"
 tca_retirement.14.desc:0 "既已准许[scope:tca_retirement_applicant.GetTitledFirstName]致仕，是否再加官一级，以示优礼？"
 tca_resume_decision_request_effect_tt:0 "上疏请复，等候皇帝准许。获准生效时花费[EmptyScope.ScriptValue('tca_retirement_resume_cost_value')|0]影响力，结束奉祠并恢复候任资格，不直接授予实职；被拒或失效不扣费。"
 tca_resume_decision_effect_tt:0 "花费[EmptyScope.ScriptValue('tca_retirement_resume_cost_value')|0]影响力，结束奉祠并恢复候任资格，不直接授予实职。"
 tca_retirement_transfer_effect_tt:0 "将家门与庄园交给合法继承人，并改为扮演该继承人；原人物保留奉祠或致仕头衔、个人官品、闲退身份与俸禄。"
 tca_retirement.20.keep_tt:0 "继续扮演当前人物；日后合乎条件时，仍可通过“放弃领导家族”决议交托家业。"
 tca_retirement_transfer_ready_tt:0 "已卸任实职，且奏请与授品事务均已结案"
