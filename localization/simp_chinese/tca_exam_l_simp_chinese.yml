l_simp_chinese:
 tca_exam_commissioner_court_position:0 "知贡举"
 tca_exam_commissioner_court_position_desc:0 "主持会试与殿试，为朝廷遴选进士。"
 tca_exam_commissioner_auto_exam:0 "知贡举·自动开科"
 tca_exam_commissioner_auto_exam_desc:0 "每年到期时请皇帝决定是否开科。"
 tca_exam_commissioner_manual_exam:0 "知贡举·常规"
 tca_exam_commissioner_manual_exam_desc:0 "不主动请开科；皇帝可随时亲自主持原版会试。"
 tca_exam.1.t:0 "请开科举"
 tca_exam.1.desc:0 "开科取士之期已至，知贡举[commissioner.GetTitledFirstName]依制奏请开科，已将本届贡举的筹备条陈呈至御前，礼部与有司官员在阶下候命。\n\n在降旨锁院之前，朝廷尚需定下本科的章程：究竟是由朕亲临主持本届会试，还是将考校诸事交由[commissioner.GetTitledFirstName]代为主持；若委派[commissioner.GetTitledFirstName]代为主持，又当命其依常科办理，还是视朝廷用人缓急改行小比或大开。旨意既下，有司即可依制行事。"
 tca_exam.1.focus_learning:0 "学识"
 tca_exam.1.focus_martial:0 "军事"
 tca_exam.1.focus_stewardship:0 "管理"
 tca_exam.1.count:0 "候选池：[ROOT.Char.MakeScope.Var('tca_exam_expected_entrants').GetValue|0]人。"
 tca_exam.1.scale_note:0 "今科取士尺度由知贡举拟定。"
 tca_exam.1.option_small:0 "委派知贡举主持，今科仅行小比。"
 tca_exam.1.option_standard:0 "委派知贡举主持，依常科取士。"
 tca_exam.1.option_grand:0 "委派知贡举主持，大开科场广取士子。"
 tca_exam.1.option_postpone:0 "此事暂缓，容后再议。"
 tca_exam.1.delegate_tt:0 "锁院考校后直接结算并呈报会试结果\n考试侧重：[host.Custom('tca_exam_focus_label')]\n合格候选池：[host.MakeScope.Var('tca_exam_expected_entrants').GetValue|0]人"
 tca_exam.1.postpone_tt:0 "本次暂不开科，待日后再行奏请。"
 tca_exam.host_button:0 "朕当亲自主持本科会试。"
 tca_exam.host_button_tt:0 "将进入原版会试活动流程。"
 tca_exam_cooldown_tt:0 "距上次会试不足五年"
 tca_exam.2.t:0 "会试放榜"
 tca_exam.2.desc:0 "礼部贡院锁院考校已毕，知贡举[commissioner.GetTitledFirstName]将核定后的奏名文册呈报御前。本届会试依既定章程弥封考校，入场应试举子的去取均已核定。\n\n"
 tca_exam.2.passed:0 "展开奏名文册，本届中式名单与名次已然排定，[ROOT.Char.MakeScope.Var('tca_exam_top_1').Char.GetTitledFirstName]在考校中名列本科第一。奏名文册已交礼官候旨，只待张榜晓谕，并择日举行殿试传胪。\n\n"
 tca_exam.2.no_pass:0 "然而展开奏名文册，其上却并无中式人选。本届虽有士子入场应试，但经考校甄别，竟无一人合乎取士格例。[commissioner.GetTitledFirstName]未敢妄自凑数，依制据实呈报。既无合格人选，本科便无中式名单可列，后续的殿试传胪亦随之作罢。\n\n"
 tca_exam.2.count:0 "本科会试取中[ROOT.Char.MakeScope.Var('tca_exam_pass_count').GetValue|0]人，落第[ROOT.Char.MakeScope.Var('tca_exam_failee_count').GetValue|0]人。"
 tca_exam.2.top_1:0 "第一名　[ROOT.Char.MakeScope.Var('tca_exam_top_1').Char.GetTitledFirstName]"
 tca_exam.2.top_2:0 "第二名　[ROOT.Char.MakeScope.Var('tca_exam_top_2').Char.GetTitledFirstName]"
 tca_exam.2.top_3:0 "第三名　[ROOT.Char.MakeScope.Var('tca_exam_top_3').Char.GetTitledFirstName]"
 tca_exam.2.top_4:0 "第四名　[ROOT.Char.MakeScope.Var('tca_exam_top_4').Char.GetTitledFirstName]"
 tca_exam.2.top_5:0 "第五名　[ROOT.Char.MakeScope.Var('tca_exam_top_5').Char.GetTitledFirstName]"
 tca_exam.2.top_6:0 "第六名　[ROOT.Char.MakeScope.Var('tca_exam_top_6').Char.GetTitledFirstName]"
 tca_exam.2.top_7:0 "第七名　[ROOT.Char.MakeScope.Var('tca_exam_top_7').Char.GetTitledFirstName]"
 tca_exam.2.top_8:0 "第八名　[ROOT.Char.MakeScope.Var('tca_exam_top_8').Char.GetTitledFirstName]"
 tca_exam.2.top_9:0 "第九名　[ROOT.Char.MakeScope.Var('tca_exam_top_9').Char.GetTitledFirstName]"
 tca_exam.2.top_10:0 "第十名　[ROOT.Char.MakeScope.Var('tca_exam_top_10').Char.GetTitledFirstName]"
 tca_exam.2.a:0 "准奏，放榜并筹备殿试传胪。"
 tca_exam.2.a_no_pass:0 "知道了，将文册按例收存。"
 tca_exam.2.a_tt:0 "后续进入殿试传胪阶段\n取中人数：[host.MakeScope.Var('tca_exam_pass_count').GetValue|0]人\n会试榜首：[host.MakeScope.Var('tca_exam_top_1').Char.GetTitledFirstName]\n考试侧重：[host.Custom('tca_exam_focus_label')]"
 tca_exam.2.a_no_pass_tt:0 "本届科举就此结束，不再举行殿试传胪\n取中人数：0人\n考试侧重：[host.Custom('tca_exam_focus_label')]"
 tca_exam.3.t:0 "殿试传胪"
 tca_exam.3.desc:0 "殿廷试策已毕，殿上仪仗齐备，中式贡士已在殿前候旨，静候传胪唱名。\n\n礼官奉上名册，由传胪官高声宣唱，榜首[ROOT.Char.MakeScope.Var('tca_exam_top_1').Char.GetTitledFirstName]于殿前听宣受命。经此天子临轩、传胪赐第，名册上的贡士方才正式获赐进士出身，成为名正言顺的“天子门生”。唱名礼成之后，这卷名册将按例收存归档，新科进士亦就此步入朝廷仕途。"
 tca_exam.3.first:0 "\n\n$BULLET$状元　[ROOT.Char.MakeScope.Var('tca_exam_top_1').Char.GetTitledFirstName]"
 tca_exam.3.second:0 "\n$BULLET$榜眼　[ROOT.Char.MakeScope.Var('tca_exam_top_2').Char.GetTitledFirstName]"
 tca_exam.3.third:0 "\n$BULLET$探花　[ROOT.Char.MakeScope.Var('tca_exam_top_3').Char.GetTitledFirstName]"
 tca_exam.3.a:0 "礼成，将名册按例归档。"
 tca_exam.3.a_tt:0 "本届科举流程结束\n赐进士出身：[host.MakeScope.Var('tca_exam_palace_count').GetValue|0]人\n本科状元：[host.MakeScope.Var('tca_exam_top_1').Char.GetTitledFirstName]"
 tca_exam.5.t:0 "无人应试"
 tca_exam.5.desc:0 "贡院开科的时限已满，知贡举[commissioner.GetTitledFirstName]呈至御前的名册却空无一人，殿内一时安静。\n\n本届科举虽已依制设场、考官亦已锁院就位，然而直至应试之期已过，竟无一人入场赴考。场屋空置，本科既无士子应试，自也无从考校取人，[commissioner.GetTitledFirstName]只得依制据实奏报。后续的放榜与传胪亦随之作罢，礼官遂将这份空白案卷按例归档收存。"
 tca_exam.5.a:0 "知道了，将案卷按例收存。"
 tca_exam.5.a_tt:0 "本届科举就此结束\n应试人数：0人（本科无人应试）\n原定侧重：[host.Custom('tca_exam_focus_label')]"

 # 家族结果通知显式读取考生，避免继承皇帝的根作用域。
 tca_exam_family_failed_title:0 "[GetPlayer.Custom2('RelationToMeShort', tca_exam_result_candidate)|U]会试落榜"
 tca_exam_family_failed_desc:0 "[tca_exam_result_candidate.GetShortUIName|U]在会试中未能达到考官的期望"
 tca_exam_family_metropolitan_title:0 "[GetPlayer.Custom2('RelationToMeShort', tca_exam_result_candidate)|U]通过会试"
 tca_exam_family_metropolitan_desc:0 "[tca_exam_result_candidate.GetShortUIName|U]成功通过了会试"
 tca_exam_family_palace_title:0 "[GetPlayer.Custom2('RelationToMeShort', tca_exam_result_candidate)|U]通过殿试"
 tca_exam_family_palace_desc:0 "[tca_exam_result_candidate.GetShortUIName|U]在皇宫内证明了自己的价值"
 tca_exam_not_serving_tt: "你未担任官职或知贡举"
