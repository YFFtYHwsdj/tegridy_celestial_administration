l_simp_chinese:
 tca_frontier_recovery_cb:0 "边疆追讨"
 tca_frontier_recovery_war:0 "[ATTACKER.GetShortUIName]的边疆追讨战争"
 tca_frontier_recovery_victory:0 "将本次失地归还原主。"
 tca_frontier_recovery_failed:0 "未能夺回失地。"
 tca_frontier_recovery.opening:0 "致[ROOT.Char.GetTitledFirstName]："
 tca_frontier_recovery.notice.opening:0 "边疆战报"
 tca_frontier_recovery.1.desc:0 "边地已落入[scope:tca_fs_record.Var('tca_fs_attacker').Char.GetTitledFirstName]之手。此前你曾答应援助，如今可愿领兵追讨，将失地归还原主？"
 tca_frontier_recovery.1.a:0 "我来领兵，夺回失地。"
 tca_frontier_recovery.1.a.tt:0 "立即发动追讨战争；胜利后失地直接归还原主。"
 tca_frontier_recovery.1.b:0 "此次不宜再战。"
 tca_frontier_recovery.2.desc:0 "边地失守，如今我已起兵追讨。可愿助我夺回失地？"
 tca_frontier_recovery.2.a:0 "七日后，我军便来。"
 tca_frontier_recovery.2.a.tt:0 "七日后加入这场追讨战争。"
 tca_frontier_recovery.2.b:0 "此番恕难从命。"
 tca_frontier_recovery.3.none:0 "各方未能组织追讨，此次失地暂且无力收复。"
 tca_frontier_recovery.3.started:0 "[scope:tca_fs_record.Var('tca_fd_leader').Char.GetTitledFirstName]已领兵追讨。若能取胜，此次失地便可归还原主。"
 tca_frontier_recovery.3.failed:0 "追讨已经结束，未能夺回此次失地。"
 tca_frontier_recovery.3.returned:0 "追讨获胜，此次失地已归还原主。"
 tca_frontier_recovery.3.a:0 "知道了。"
