l_simp_chinese:
 tca_frontier_recovery_cb:0 "失地收复"
 tca_frontier_recovery_war:0 "[ATTACKER.GetShortUIName]的失地收复战争"
 tca_frontier_recovery_victory:0 "收复仍可追讨的失地；原封臣若另有土地，只夺回原失地，交给收复领袖。"
 tca_frontier_recovery_failed:0 "未能夺回失地。"
 tca_frontier_recovery.opening:0 "致[ROOT.Char.GetTitledFirstName]："
 tca_frontier_recovery.notice.opening:0 "收复战报"
 tca_frontier_recovery.1.desc:0 "失地已落入[scope:tca_fs_record.Var('tca_fd_enemy').Char.GetTitledFirstName]之手。此前你曾答应援助，如今可愿领兵收复？"
 tca_frontier_recovery.1.a:0 "我来领兵，夺回失地。"
 tca_frontier_recovery.1.a.tt:0 "立即发动收复战争。通常恢复原主及其隶属；原封臣若另有土地，则只将原失地交给你。"
 tca_frontier_recovery.1.b:0 "此次不宜再战。"
 tca_frontier_recovery.2.desc:0 "失地尚未夺回，如今我已起兵收复。可愿助我一臂之力？"
 tca_frontier_recovery.2.a:0 "七日后，我军便来。"
 tca_frontier_recovery.2.a.tt:0 "七日后加入这场追讨战争。"
 tca_frontier_recovery.2.b:0 "此番恕难从命。"
 tca_frontier_recovery.3.none:0 "各方未能组织追讨，此次失地暂且无力收复。"
 tca_frontier_recovery.3.started:0 "[scope:tca_fs_record.Var('tca_fd_leader').Char.GetTitledFirstName]已领兵收复失地。"
 tca_frontier_recovery.3.failed:0 "追讨已经结束，未能夺回此次失地。"
 tca_frontier_recovery.3.returned:0 "收复获胜，此次仍可追讨的失地已夺回。"
 tca_frontier_recovery.3.a:0 "知道了。"
