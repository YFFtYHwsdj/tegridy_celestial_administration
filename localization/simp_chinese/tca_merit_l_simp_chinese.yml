 tca_merit_grant.2.rank_8: "正月里的春寒还未散尽，今年铨叙的文书便已送到了手边。自初入九品以来，经手过的公事与日常点滴都逐一记在历纸上，如今终于换来这第一道迁转公文。展开新领的八品告身，墨迹尚新——虽然在偌大的官场中仍属微末，但总算脱去了初入仕途时的生疏，在朝廷官籍上真正站稳了脚跟。"
 tca_merit_grant.2.rank_7: "在八品的班次里磨勘日久，见过太多同僚空有才干与厚厚一摞历纸，却只能在末班年复一年地苦候。今年正月铨叙放榜，我的名字终于从一众候补人选中脱颖而出，正式由八品晋入七品。跨过这道关口，便算真正走出了低阶僚属的行列，往后无论是外放牧民还是候补要职，眼前的天地都比从前宽阔了许多。"
 tca_merit_grant.2.rank_6: "今岁铨叙核定，有司查验过我近年来的历纸与考绩，准予由七品晋升六品。到了这个品级，早已不是当年那个对着公文反复斟酌的新进官员；迎来送往与案牍劳形之间，行事自有一份熟稔与从容。新换的六品告身拿在手中，分量不轻不重，恰是多年勤勉任事最好的见证。"
 tca_merit_grant.2.rank_5: "五品是朝廷品秩中一道极要紧的分水岭。今年正月铨叙的奏钞批下，我得以由六品正式擢升五品。跨过这道门槛，便不再是寻常听候差遣的中下僚佐，而真正跻身朝廷高阶命官之列，具备了出领一路、独当一面的资望。看着案头新颁的告身，更能觉出这几分名器背后的沉甸甸托付。"
 tca_merit_grant.2.rank_4: "仕途越往高处走，同列之中的竞争便越发严苛。今春铨司奏准，将我的官品由五品晋为四品。能在一众资深望重的同僚中再进一步，靠的已不只是案头苦干，更是多年历事积攒下的深厚资望。如今放眼朝野，位列四品已算得上显要重臣，往来皆是朝堂与各路有数的人物。"
 tca_merit_grant.2.rank_3: "今年正月铨叙尘埃落定，我由四品晋至三品。回想自初入仕途以来，一任任差遣、一纸纸考绩积攒至今，终于走到了寻常迁转所能抵达的尽头。三品已是朝廷崇阶，足以望重朝野；自此往上，便不再是仅凭年资考绩所能企及，唯有真正入掌部堂、跻身中枢重位，方能再上层楼。"
 tca_merit_grant.2.ordinary: "今年正月的铨叙已经办结，有司核验过往日积累的考绩，降下新颁告身，将我由$tca_merit_notice_source_rank$晋为$tca_merit_notice_target_rank$。历年奔走任事的辛劳，至此化作了官册上实实在在的一步迁转。"
 tca_merit_grant.2.central: "中枢的除命刚刚落定，朝廷便按我所领的中朝重职，降下改授品秩的敕命，将我由$tca_merit_notice_source_rank$特晋为$tca_merit_notice_target_rank$。既受简拔入掌部堂，品秩亦随职事一并改易。接过这轴新颁的告身，身处庙堂高处，来日案头所决的，也将是牵动天下的朝廷大政。"
 tca_merit_grant.2.rank_1: "随着入掌中枢极要之职，朝廷特降制书，将我的官品由$tca_merit_notice_source_rank$晋为一品。一品乃是人臣品秩的极致，唯有秉钧当国的宰执、总领风宪的台长或执掌兵柄的枢臣方能获授。展读制词，往昔宦海浮沉历历在目；如今立于百官之首，一言一行皆系天下安危与朝局轻重。"
 tca_merit_grant.2.rank_1_initial: "随着入掌中枢极要之职，朝廷特降制书，不拘常格，直接初授我为一品。自白身而骤登人臣极品，这般破格简拔在朝堂之上亦属罕闻；如今立于百官之首，唯有以实绩酬答天恩，方能服众望而安朝局。"
 tca_merit_grant.2.civilian: "\n\n吏部文选的名册上已换上了我的新阶。钱谷、词讼与日常文移虽仍繁杂，但有了这一层资序垫底，往后在文官仕途上行走，底气终归足了许多。"
 tca_merit_grant.2.civilian_mid: "\n\n吏部铨曹的籍册随之改定，同僚往来道贺的书信也多了起来。在文臣班列之中，这样的品级已算得上中流砥柱，朝廷选派地方守臣或各司干员时，我的名字自然会排在更显眼的位置。"
 tca_merit_grant.2.civilian_high: "\n\n放眼整个文官班次，能修到这一品秩者已属凤毛麟角。往日要在铨院门前苦候唱名的光景早已远去，如今名列朝廷高阶文臣之林，一举一动都自带几分清望与威重。"
 tca_merit_grant.2.civilian_central: "\n\n列名中朝堂官与政事重臣之班，文臣仕途的清贵莫过于此。往后出入禁省、参决章奏，笔下所批的每一道文书，都将化作发往四方州郡的朝廷政令。"
 tca_merit_grant.2.military: "\n\n武选名册与兵籍之上已记下了我的新品级。操练营伍、巡检城防本是苦差，但既有朝廷叙功晋秩，往后在军州武职中图谋进身，总算有了更硬实的资历。"
 tca_merit_grant.2.military_mid: "\n\n枢密院与吏部武选的案卷已同步改易。在武将与军政班列中，这一品秩足以弹压骄兵、节制一方；无论是驻守沿边重地还是主持军州防务，腰杆都比往日更硬。"
 tca_merit_grant.2.military_high: "\n\n能凭军功与历练在武臣班次中走到这一步，实属不易。如今在枢府与诸路帅司的簿籍上，我已是屈指可数的高阶宿将，麾下将校望见旗号，亦当凛然遵令。"
 tca_merit_grant.2.military_central: "\n\n高踞中枢、总领天下兵马机宜，这是无数武人终生仰望的极位。天下禁旅与边防军政皆汇于案前，唯有审慎筹度，方能不负这一身崇高品秩。"
 tca_merit_grant.2.cross: "此次迁秩越过旧阶，往后无论外领重镇、内预朝议，皆较昔日大不相同；名器愈重，愈当慎终如始。"
 tca_merit_grant.2.within: "虽属循资累进，亦是积年寸功所致；按历渐迁，来日自可更上层楼。"
 tca_merit_grant.2.a: "收好告身，往后更当尽心任事。"
 tca_merit_approved_base_modifier: "核定官品"
 tca_merit_approved_reduction_modifier: "官品核定"
 tca_merit_grant.2.central_initial: "中枢的任命文书刚刚落定，朝廷便按我所领的中朝职事，越过寻常铨选资序，直接降下告身，初授我为$tca_merit_notice_target_rank$。不经州县末班的漫长磨勘而一步踏入朝堂高列，既是罕见的殊遇，也意味着朝野上下的目光都将落在我一人身上。"
 tca_merit_courtier_cap_compensation_modifier: "仕途官品"
 tca_changed_career_path_recently_tt: "在过去5年内未曾转换过仕途文武路线"
