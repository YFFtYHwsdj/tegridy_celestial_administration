 tca_court_offer.1.decline: "此次恕难应命。"
 tca_court_offer.1.decline_tt: "拒绝此次邀请，一年内不再收到差遣邀请。"
 tca_court_offer.1.expired: "知道了。"
 tca_court_offer.3.t: "差遣已生变故"
